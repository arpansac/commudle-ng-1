<form [formGroup]="hackathonProjectDetailsForm">
  <div *ngIf="hackathonTracks && hackathonTracks.length > 0">
    <label for="hackathon_track_id">Select Track (Optional)</label>
    <br />
    <select
      formControlName="hackathon_track_id"
      name="hackathon_track_id"
      id="hackathon_track_id"
      [ngClass]="{
        'com-text-[#8E9BB3]': hackathonProjectDetailsForm.get('hackathon_track_id').value === ''
      }"
      (change)="updateProblemStatement()"
    >
      <option selected disabled value="">Select Track</option>
      <option *ngFor="let track of hackathonTracks" [value]="track.id">{{ track.name }}</option>
    </select>
  </div>

  <div *ngIf="selectedTrackProblemStatements.length > 0">
    <label for="hackathon_problem_statement_id">Select Problem Statement (Optional)</label>
    <br />
    <select
      formControlName="hackathon_problem_statement_id"
      name="hackathon_problem_statement_id"
      id="hackathon_problem_statement_id"
      [ngClass]="{
        'com-text-[#8E9BB3]': hackathonProjectDetailsForm.get('hackathon_problem_statement_id').value === ''
      }"
    >
      <option selected disabled value="">Select Problem Statement</option>
      <option *ngFor="let ps of selectedTrackProblemStatements" [value]="ps.id">
        <div [innerHTML]="ps.title"></div>
      </option>
    </select>
  </div>

  <div class="action-buttons">
    <button status="primary" nbButton (click)="previousButton()">Previous</button>
    <button [disabled]="hackathonProjectDetailsForm.invalid" (click)="submitProjectDetails()" nbButton status="primary">
      Next
    </button>
  </div>
</form>
