<nb-card *ngIf="hrgId && userTeamDetails" class="registration-card">
  <nb-card-header>
    <div class="registration-header">
      <div class="status-section">
        <h3 class="registration-title">Registration Status</h3>
        <div class="status-badge" [ngClass]="'status-' + userTeamDetails.registration_status">
          {{ userTeamDetails.registration_status | titlecase }}
        </div>
      </div>
      <div *ngIf="canEditForm" class="edit-section">
        <a
          [routerLink]="['/communities', hackathon.community.slug, 'hackathons', hackathon.slug, 'fill-form', hrgId]"
          class="edit-link"
        >
          Edit Registration
        </a>
      </div>
    </div>
  </nb-card-header>

  <nb-card-body>
    <!-- Rounds Progress Section -->
    <div class="rounds-section">
      <h4 class="rounds-title">Hackathon Rounds</h4>
      <div class="rounds-container">
        <commudle-hackathon-round-card
          *ngFor="let round of rounds; let i = index"
          [round]="round"
          [index]="i"
          [userTeamDetails]="userTeamDetails"
        >
        </commudle-hackathon-round-card>
      </div>
    </div>
  </nb-card-body>
</nb-card>
