<nb-card>
  <nb-card-header>
    <h4>Submit PPT - {{ round.name }}</h4>
  </nb-card-header>
  <nb-card-body>
    <form [formGroup]="uploadForm" (ngSubmit)="onSubmit()">
      <div class="upload-section">
        <label class="upload-label">Upload PowerPoint Presentation</label>
        <input type="file" #fileInput accept=".ppt,.pptx" (change)="onFileSelected($event)" class="file-input" />
        <button type="button" nbButton outline status="primary" (click)="fileInput.click()" class="upload-button">
          Choose File
        </button>
        <div *ngIf="selectedFile" class="file-info">Selected: {{ selectedFile.name }}</div>
      </div>

      <div class="comments-section">
        <label class="comments-label">Comments (Optional)</label>
        <textarea
          nbInput
          fullWidth
          placeholder="Add any comments about your submission..."
          formControlName="comments"
          rows="3"
        >
        </textarea>
      </div>
    </form>
  </nb-card-body>
  <nb-card-footer>
    <div class="dialog-actions">
      <button nbButton ghost (click)="close()">Cancel</button>
      <button nbButton status="primary" [disabled]="!selectedFile || isUploading" (click)="onSubmit()">
        {{ isUploading ? 'Uploading...' : 'Submit PPT' }}
      </button>
    </div>
  </nb-card-footer>
</nb-card>
