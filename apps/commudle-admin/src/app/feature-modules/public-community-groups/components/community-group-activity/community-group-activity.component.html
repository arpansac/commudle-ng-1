<div class="base-layout">
  <div class="container">
    <div class="two-column-layout medium">
      <div class="main-column">
        <!-- About -->
        <app-community-group-about></app-community-group-about>
        <!-- upcoming Events -->
        <com-card *ngIf="events.length > 0" class="upcoming-events-card">
          <com-card-header class="event-card-header">
            <div class="header">
              <div class="icon">
                <fa-icon [icon]="faCalendar"></fa-icon>
              </div>
              <div>
                <h5>Upcoming Events</h5>
              </div>
            </div>
          </com-card-header>
          <com-card-body class="card-body">
            <div *ngIf="isLoadingEvents" class="com-h-[350px]">
              <app-loading-spinner></app-loading-spinner>
            </div>
            <div class="event-card-list">
              <commudle-event-card *ngFor="let event of events" [event]="event"></commudle-event-card>
            </div>
          </com-card-body>
        </com-card>

        <!-- upcoming Hackathons -->
        <com-card *ngIf="upcomingHackathons.length > 0" class="upcoming-events-card">
          <com-card-header class="event-card-header">
            <div class="header">
              <div class="hackathon-image">
                <img [src]="environment.base_url + '/icons/hackathon-icon-primary.svg'" alt="Hackathon Icon" />
              </div>
              <div>
                <h5>Upcoming Hackathons</h5>
              </div>
            </div>
          </com-card-header>
          <com-card-body class="card-body">
            <div class="event-card-list">
              <commudle-hackathon-medium-card
                *ngFor="let hackathon of upcomingHackathons"
                [hackathon]="hackathon"
              ></commudle-hackathon-medium-card>
            </div>
          </com-card-body>
        </com-card>

        <!-- channels -->
        <com-card *ngIf="channels.length > 0" class="channel-card-header">
          <com-card-header>
            <div class="header">
              <div class="icon">
                <fa-icon [icon]="faHashtag"></fa-icon>
              </div>
              <div>
                <h5>Active Channels to join</h5>
              </div>
            </div>
          </com-card-header>
          <com-card-body class="card-body">
            <app-loading-spinner *ngIf="isLoading"></app-loading-spinner>
            <div class="channels-cards-list">
              <div class="channel-card" *ngFor="let channel of channels">
                <commudle-channel-card
                  [channel]="channel"
                  [horizontalScroll]="true"
                  [showLatestMessage]="false"
                ></commudle-channel-card>
              </div>
            </div>
          </com-card-body>
        </com-card>

        <!-- communities -->
        <com-card *ngIf="communities.length > 0" class="communities-card-header">
          <com-card-header>
            <div class="header">
              <div class="icon">
                <fa-icon [icon]="faUsers"></fa-icon>
              </div>
              <div>
                <h5>Active Communities to join</h5>
              </div>
            </div>
          </com-card-header>
          <com-card-body class="card-body">
            <app-loading-spinner *ngIf="isLoading"></app-loading-spinner>
            <div class="com-flex com-flex-wrap">
              <div class="communities-cards">
                <div *ngFor="let community of communities" class="community-card">
                  <commudle-featured-community-card-medium
                    [community]="community"
                    [showDescription]="true"
                  ></commudle-featured-community-card-medium>
                </div>
              </div>
            </div>
          </com-card-body>
        </com-card>

        <!--forums-->
        <com-card *ngIf="forums.length > 0" class="forum-card-header">
          <com-card-header>
            <div class="header">
              <div class="icon">
                <fa-icon [icon]="faHashtag"></fa-icon>
              </div>
              <div>
                <h5>Active Forums to join</h5>
              </div>
            </div>
          </com-card-header>
          <com-card-body class="card-body">
            <app-loading-spinner *ngIf="isLoading"></app-loading-spinner>
            <div class="forums-cards-list">
              <div class="forum-card" *ngFor="let forum of forums">
                <commudle-forum-card [forum]="forum" [horizontalScroll]="true"></commudle-forum-card>
              </div>
            </div>
          </com-card-body>
        </com-card>
      </div>

      <div class="right-column">
        <div class="recent-tech">
          <commudle-public-home-list-events-tech-sessions
            [communityGroupId]="communityGroup?.id"
          ></commudle-public-home-list-events-tech-sessions>
        </div>
        <div class="speakers">
          <commudle-public-home-list-events-speakers
            [parentType]="'communities'"
            [communityGroupId]="communityGroup?.id"
          ></commudle-public-home-list-events-speakers>
        </div>
      </div>
    </div>
  </div>
</div>
