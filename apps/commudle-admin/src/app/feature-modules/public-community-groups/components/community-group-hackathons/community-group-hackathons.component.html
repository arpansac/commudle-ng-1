<!-- upcoming hackathons -->
<com-card *ngIf="upcomingHackathons.length > 0 || isLoadingUpcoming" class="hackathons-card">
  <com-card-header>
    <h6 class="section-title"><fa-icon [icon]="faCalendarDays"></fa-icon> Upcoming Hackathons</h6>
  </com-card-header>
  <com-card-body>
    <app-loading-spinner *ngIf="isLoadingUpcoming"></app-loading-spinner>
    <div *ngIf="upcomingHackathons.length > 0" class="hackathon-cards-list">
      <commudle-hackathon-large-card
        *ngFor="let hackathon of upcomingHackathons"
        [hackathon]="hackathon"
      ></commudle-hackathon-large-card>
    </div>
  </com-card-body>
</com-card>

<!-- past hackathons -->
<com-card class="hackathons-card">
  <com-card-header>
    <h6 class="section-title"><fa-icon [icon]="faCalendarDays"></fa-icon> Past Hackathons</h6>
  </com-card-header>
  <com-card-body>
    <app-loading-spinner *ngIf="isLoadingPast"></app-loading-spinner>
    <div *ngIf="pastHackathons.length > 0" class="hackathon-cards-list hackathon-cards-grid">
      <commudle-hackathon-medium-card
        *ngFor="let hackathon of pastHackathons"
        [hackathon]="hackathon"
      ></commudle-hackathon-medium-card>
    </div>
    <p *ngIf="!isLoadingPast && pastHackathons.length === 0" class="com-text-sm com-text-gray-500 com-m-0">
      No past hackathons yet
    </p>
  </com-card-body>
</com-card>
