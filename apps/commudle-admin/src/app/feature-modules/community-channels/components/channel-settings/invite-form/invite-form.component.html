<div class="invite-form">
  <!-- Join Link Section -->
  <div class="invite-section">
    <label class="form-label">Link to join channel</label>
    <div class="join-link-box">
      <p class="join-link-url">{{ appURL }}/{{ redirectUrl }}/join/{{ joinToken }}</p>
      <button nbButton ghost size="small" (click)="copyJoinLink()" type="button">
        <nb-icon [icon]="linkCopied ? 'checkmark-circle-2-outline' : 'copy-outline'"></nb-icon>
        {{ linkCopied ? 'Copied' : 'Copy' }}
      </button>
    </div>
    <button
      nbButton
      status="info"
      outline
      size="small"
      (click)="refreshJoinToken()"
      type="button"
      *ngIf="
        channelsRoles[communityChannel.id] &&
        channelsRoles[communityChannel.id].includes(EUserRoles.COMMUNITY_CHANNEL_ADMIN)
      "
    >
      <nb-icon icon="refresh"></nb-icon>
      Generate New Link
    </button>
  </div>

  <!-- Email Invite Section -->
  <div class="invite-section">
    <label class="form-label">Invite by email</label>
    <form [formGroup]="memberInviteForm" (ngSubmit)="sendMemberInvite()" class="email-invite-form">
      <input nbInput fullWidth formControlName="email" placeholder="Enter email address" />
      <button type="submit" nbButton [disabled]="!memberInviteForm.valid" size="small" status="primary">
        Send Invite
      </button>
    </form>
  </div>
</div>
