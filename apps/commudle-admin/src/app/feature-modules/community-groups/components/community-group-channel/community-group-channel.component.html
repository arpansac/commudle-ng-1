<div class="channels-page" *ngIf="communityGroup">
  <!-- Header -->
  <header class="page-header">
    <div class="header-info">
      <h1 class="page-title">
        <nb-icon icon="message-circle-outline"></nb-icon>
        Channels & Forums
      </h1>
    </div>
  </header>

  <!-- Channels content -->
  <div class="channels-content">
    <commudle-channel-forum-dashboard
      [parent]="communityGroup"
      [parentType]="EDbModels.COMMUNITY_GROUP"
    ></commudle-channel-forum-dashboard>
  </div>
</div>
