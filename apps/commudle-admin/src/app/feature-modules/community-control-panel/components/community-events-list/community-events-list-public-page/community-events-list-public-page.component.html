<!-- DEPRECATED -->
<div class="actions" *ngIf="eventData">
  <a
    [routerLink]="['/communities/', eventData.kommunity_id, 'events', eventData.slug]"
    nbButton
    hero
    status="info"
    size="tiny"
    target="_blank"
  >
    Public Page
  </a>

  <a
    [routerLink]="['/admin/communities/', eventData.kommunity_id, 'event-dashboard', eventData.slug, 'stats']"
    nbButton
    size="tiny"
    status="success"
    target="_blank"
    class="stats"
  >
    <nb-icon icon="trending-up-outline"></nb-icon>
    Stats <sup>New</sup>&nbsp;
    <nb-icon icon="external-link"></nb-icon>
  </a>
</div>

<ng-template #cloneEvent let-data let-ref="dialogRef">
  <nb-card class="clone-event">
    <nb-card-header>
      <div>Clone of {{ eventData.name }}</div>
      <button ghost nbButton size="small" (click)="ref.close()">
        <nb-icon icon="close"></nb-icon>
      </button>
    </nb-card-header>
    <nb-card-body>
      <app-edit-event [eventId]="eventData.id" type="clone"></app-edit-event>
    </nb-card-body>
  </nb-card>
</ng-template>
