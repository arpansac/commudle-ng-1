<div *ngIf="eventData && eventData.start_time">
  <p>
    {{ moment.tz(eventData.start_time, eventData.timezone).format('Do MMM YYYY h:mm A') }} - ({{
      moment.tz(eventData.timezone).zoneAbbr()
    }})
  </p>
  <div *ngIf="eventData.status === 'open'">
    <p *ngIf="moment(eventData.start_time) > moment()" class="upcoming">
      {{ moment(eventData.start_time).fromNow() | titlecase }}
    </p>
  </div>
</div>
