<div class="event-dashboard-actions" *ngIf="rowData">
  <a [routerLink]="['event-dashboard', rowData.slug]" nbButton hero status="info" size="tiny"> Dashboard </a>
  <button
    *ngIf="rowData.start_time"
    (click)="openCloneEventWindow(cloneEvent)"
    outline
    nbButton
    status="info"
    size="tiny"
  >
    Clone
  </button>
</div>

<ng-template #cloneEvent let-data let-ref="dialogRef">
  <nb-card class="clone-event">
    <nb-card-header>
      <div>Clone of {{ rowData.name }}</div>
      <button ghost nbButton size="small" (click)="ref.close()">
        <nb-icon icon="close"></nb-icon>
      </button>
    </nb-card-header>
    <nb-card-body>
      <app-edit-event [eventId]="rowData.id" type="clone"></app-edit-event>
    </nb-card-body>
  </nb-card>
</ng-template>
