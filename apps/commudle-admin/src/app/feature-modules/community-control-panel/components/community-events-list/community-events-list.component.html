<div class="community-events-list">
  <div class="page-actions">
    <a nbButton status="primary" [routerLink]="['/admin/communities', communityId, 'event-dashboard', 'new']">
      <fa-icon [icon]="faPlusSquare"></fa-icon>
      &nbsp; Create New Event
    </a>
  </div>

  <!--  <div> -->
  <!-- <angular2-smart-table [settings]="tableSettings" [source]="events"></angular2-smart-table> -->
  <!-- </div> -->

  <form [formGroup]="searchForm">
    <div class="name-filter">
      <nb-form-field>
        <nb-icon icon="search" nbPrefix></nb-icon>
        <input
          [disabled]="isLoading"
          fieldSize="small"
          formControlName="name"
          fullWidth
          nbInput
          placeholder="Search by Event.."
          type="text"
        />
      </nb-form-field>
    </div>
  </form>

  <div class="status-filter">
    <nb-tag-list>
      <nb-tag
        appearance="outline"
        [text]="options[0]"
        status="primary"
        [removable]="isStatusSelected(options[0]) ? 'true' : 'false'"
        [ngClass]="{ activeTag: isStatusSelected(options[0]) }"
        (click)="filterByTags(options[0])"
      ></nb-tag>
      <nb-tag
        appearance="outline"
        [text]="options[1]"
        status="primary"
        [removable]="isStatusSelected(options[1]) ? 'true' : 'false'"
        [ngClass]="{ activeTag: isStatusSelected(options[1]) }"
        (click)="filterByTags(options[1])"
      ></nb-tag>
      <nb-tag
        appearance="outline"
        [text]="options[2]"
        status="primary"
        [removable]="isStatusSelected(options[2]) ? 'true' : 'false'"
        [ngClass]="{ activeTag: isStatusSelected(options[2]) }"
        (click)="filterByTags(options[2])"
      ></nb-tag>
      <nb-tag
        appearance="outline"
        [text]="options[3]"
        status="primary"
        [removable]="isStatusSelected(options[3]) ? 'true' : 'false'"
        [ngClass]="{ activeTag: isStatusSelected(options[3]) }"
        (click)="filterByTags(options[3])"
      ></nb-tag>
    </nb-tag-list>
  </div>

  <section>
    <table *ngIf="events && events.length > 0">
      <tr>
        <th>Name</th>
        <th>Date</th>
        <th>Status</th>
        <th>Actions</th>
        <th>Public Page</th>
      </tr>
      <tr *ngFor="let event of events">
        <td>{{ event.name }}</td>
        <td>
          <app-community-events-list-date [rowData]="event"></app-community-events-list-date>
        </td>

        <td>{{ event.status | titlecase }}</td>
        <td class="action-buttons">
          <commudle-community-events-list-actions [rowData]="event"> </commudle-community-events-list-actions>
        </td>
        <td class="public-page-buttons">
          <commudle-community-events-list-public-page [rowData]="event"> </commudle-community-events-list-public-page>
        </td>
      </tr>
    </table>

    <app-pagination
      class="pagination"
      (goTo)="page = $event; getCommunityEvents()"
      (next)="page = $event; getCommunityEvents()"
      (previous)="page = $event; getCommunityEvents()"
      *ngIf="total > 0"
      [count]="count"
      [current]="page"
      [total]="total"
    ></app-pagination>
  </section>

  <ng-template #cloneEvent let-data let-ref="dialogRef">
    <nb-card class="clone-event">
      <nb-card-header>
        <div>Clone of {{ selectedEvent?.name }}</div>
        <button ghost nbButton size="small" (click)="ref.close()">
          <nb-icon icon="close"></nb-icon>
        </button>
      </nb-card-header>
      <nb-card-body>
        <app-edit-event [eventId]="selectedEvent?.id" type="clone"></app-edit-event>
      </nb-card-body>
    </nb-card>
  </ng-template>
</div>
