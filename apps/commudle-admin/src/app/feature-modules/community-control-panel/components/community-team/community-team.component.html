<div class="community-team">
  <app-loading-spinner *ngIf="isLoading"></app-loading-spinner>
  <div *ngIf="organizers.length > 0">
    <h6 class="heading">Community Organizers</h6>
    <div class="organizers" *ngIf="!isLoading">
      <div class="user-profile" *ngFor="let org of organizers; let i = index">
        <div class="user-details">
          <app-user-profile-horizontal
            [user]="org.user"
            [socialMediaLinks]="true"
            [aboutMe]="false"
          ></app-user-profile-horizontal>
        </div>
        <div class="actions">
          <a class="clickable" *ngIf="org.status === EUserRolesUserStatus.INVITED" (click)="resendInvitationMail(org)">
            <small>Resend Invite</small>
          </a>
          <br />
          <a class="clickable" (click)="openDeleteConfirmation(removeUserDialog, org, 'organizers', i)">
            <small>Remove</small>
          </a>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="eventOrganizers.length > 0">
    <h6>Event Managers</h6>
    <div class="event_organizers">
      <div class="user-profile" *ngFor="let org of eventOrganizers; let i = index">
        <div class="user-details">
          <app-user-profile-horizontal [user]="org.user" [socialMediaLinks]="true"></app-user-profile-horizontal>
        </div>
        <div class="actions">
          <a *ngIf="org.status === EUserRolesUserStatus.INVITED" (click)="resendInvitationMail(org)">
            <small> Resend Invitation </small>
          </a>
          <a (click)="remove(org, 'eventOrganizers', i)">
            <small>Remove</small>
          </a>
        </div>
      </div>
    </div>
  </div>

  <div>
    <h6>Add an organizer</h6>
    <form class="user-roles-user-form" [formGroup]="userRolesUserForm" (ngSubmit)="createUserRolesUser()">
      <div>
        <label fullWidth>
          Email*
          <input
            type="email"
            nbInput
            fullWidth
            formControlName="email"
            placeholder="Google/Gmail Email"
            fieldSize="small"
          />
        </label>
        <span
          *ngIf="
            userRolesUserForm['controls'].email.touched &&
            userRolesUserForm['controls'].email.invalid &&
            userRolesUserForm['controls'].email.errors.required
          "
          class="validation-error-text"
        >
          Required Field
        </span>
      </div>

      <div class="save-button-bottom">
        <button
          [disabled]="!userRolesUserForm.valid"
          type="submit"
          nbButton
          fullWidth
          outline
          status="link"
          size="small"
        >
          Save
        </button>
      </div>
    </form>
  </div>
</div>

<ng-template #removeUserDialog let-data let-ref="dialogRef">
  <nb-card class="com-max-h-[90dvh]">
    <nb-card-header class="com-flex com-items-center com-justify-between">
      <span class="com-flex com-items-center com-gap-2">
        <nb-icon icon="alert-triangle" status="warning"></nb-icon>
        Confirmation
      </span>
      <button (click)="ref.close()" ghost nbButton size="small">
        <nb-icon icon="close"></nb-icon>
      </button>
    </nb-card-header>
    <nb-card-body class="com-max-w-[350px]">
      <p>
        Are you sure you want to <strong>remove</strong>&nbsp;<em>{{ data.user?.name }}</em> from the community?
      </p>
      <!-- <p>(Select the roles you want to remove them from)</p> -->
      <!-- <div class="com-flex com-flex-col com-items-start com-gap-3 com-space-x-3">
        <div *ngFor="let userRole of data.userRolesUser">
          <input
            type="checkbox"
            (change)="toggleUserRole(userRole.id)"
            [checked]="userRolesUserIds.value.includes(userRole.id)"
          />
          <label> {{ userRole.parent_name }} ({{ userRole.user_role.name }})</label><br />
        </div>
      </div> -->
      <p><strong>Note:</strong>&nbsp;This action cannot be undone.</p>
    </nb-card-body>
    <nb-card-footer class="com-flex com-items-center com-justify-between">
      <button (click)="ref.close()" ghost nbButton status="danger">No</button>
      <button (click)="remove(data.userRolesUser, data.arrayType, data.index); ref.close()" nbButton status="success">
        Yes
      </button>
    </nb-card-footer>
  </nb-card>
</ng-template>
