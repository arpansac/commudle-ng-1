<div class="forum-discussion">
  <div class="header-section">
    <div class="back-new-discussion">
      <div class="back-button" (click)="backToCategory()">
        <fa-icon [icon]="icons.faArrowLeft"></fa-icon> &nbsp;Go Back
      </div>
      <button nbButton status="primary" (click)="startNewDiscussion()" shape="semi-round">
        + Start New Discussion
      </button>
    </div>

    <div class="forum-header" *ngIf="forum">
      <h1>{{ forum.name }}</h1>
      <p>{{ forum.description }}</p>
    </div>

    <div class="search-sort-section">
      <div class="sort-dropdown">
        <select [(ngModel)]="sortBy" class="sort-select">
          <option>Most Recent</option>
          <option>Most Popular</option>
          <option>Oldest</option>
        </select>
      </div>
      <div class="search-box">
        <fa-icon [icon]="icons.faSearch" class="search-icon"></fa-icon>
        <input type="text" placeholder="Search" [(ngModel)]="searchTerm" (input)="onSearch()" class="search-input" />
      </div>
    </div>
  </div>

  <div class="discussions-list">
    <div *ngFor="let discussion of discussions" class="discussion-item">
      <div class="discussion-avatar">
        <img [src]="discussion.author.avatar" [alt]="discussion.author.name" />
      </div>
      <div class="discussion-content">
        <h3 class="discussion-title">{{ discussion.title }}</h3>
        <p class="discussion-description">{{ discussion.description }}</p>
        <div class="discussion-meta">
          <span class="posted-date">Posted on {{ discussion.postedOn }}</span>
        </div>
      </div>
      <div class="discussion-stats">
        <div class="stat-item">
          <fa-icon [icon]="icons.faComment"></fa-icon>
          <span>{{ discussion.replies }}</span>
        </div>
        <div class="stat-item">
          <fa-icon [icon]="icons.faEye"></fa-icon>
          <span>{{ discussion.views }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
