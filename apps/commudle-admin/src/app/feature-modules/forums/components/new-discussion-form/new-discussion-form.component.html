<nb-card>
  <nb-card-header>
    <span>New Discussion</span>
    <button ghost nbButton size="small" (click)="closeDialog()" shape="round">
      <nb-icon icon="close"></nb-icon>
    </button>
  </nb-card-header>
  <nb-card-body>
    <form [formGroup]="discussionForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="subject">Subject <span class="required">*</span></label>
        <input id="subject" type="text" placeholder="Enter Subject" formControlName="subject" nbInput fullWidth />
        <commudle-alert
          *ngIf="discussionForm.get('subject')?.touched && discussionForm.get('subject')?.errors?.['required']"
          [error]="true"
          errorMessage="Subject is required"
        ></commudle-alert>
        <commudle-alert
          *ngIf="discussionForm.get('subject')?.touched && discussionForm.get('subject')?.errors?.['maxlength']"
          [error]="true"
          errorMessage="Subject cannot exceed 120 characters"
        ></commudle-alert>
      </div>

      <div class="form-group">
        <label for="message">Message <span class="required">*</span></label>
        <textarea
          id="message"
          placeholder="A very long line of text which is expected to span more than two to three lines so it breaks as the text increases."
          formControlName="message"
          nbInput
          fullWidth
          rows="6"
        ></textarea>
        <commudle-alert
          *ngIf="discussionForm.get('message')?.touched && discussionForm.get('message')?.errors?.['required']"
          [error]="true"
          errorMessage="Message is required"
        ></commudle-alert>
        <commudle-alert
          *ngIf="discussionForm.get('message')?.touched && discussionForm.get('message')?.errors?.['maxlength']"
          [error]="true"
          errorMessage="Message cannot exceed 1000 characters"
        ></commudle-alert>
      </div>
    </form>
  </nb-card-body>
  <nb-card-footer>
    <div class="form-actions">
      <button type="submit" nbButton status="primary" fullWidth [disabled]="!discussionForm.valid" (click)="onSubmit()">
        Post
      </button>
    </div>
  </nb-card-footer>
</nb-card>
