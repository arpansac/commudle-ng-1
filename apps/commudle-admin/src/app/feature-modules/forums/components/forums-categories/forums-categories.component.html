<div class="categories-page">
  <div class="categories-header">
    <h1 class="categories-title">Categories</h1>
    <button class="new-topic-btn" nbButton status="primary" (click)="openDialogBox()" shape="semi-round">
      <fa-icon [icon]="icons.faPlus"></fa-icon> &nbsp; New Topic
    </button>
  </div>

  <div class="forums-grid">
    <nb-card class="forum-card" *ngFor="let forum of forums$ | async">
      <nb-card-body>
        <div class="forum-card-header">
          <span class="forum-card-title">{{ forum.name }}</span>
          <fa-icon [icon]="icons.faArrowRight"></fa-icon>
        </div>
        <p class="forum-card-category">{{ forum.group_name }}</p>
        <p class="forum-card-description">
          {{ forum.description }}
        </p>
      </nb-card-body>
    </nb-card>
  </div>
</div>
