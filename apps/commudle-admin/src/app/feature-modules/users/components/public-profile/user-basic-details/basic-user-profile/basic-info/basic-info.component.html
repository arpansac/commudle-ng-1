<form [formGroup]="basicInfoForm">
  <div class="row">
    <div>
      <div class="com-flex com-mb-4">
        <div *ngIf="uploadedProfilePicture === null" class="uploaded-profile"></div>
        <div *ngIf="uploadedProfilePicture" class="uploaded-profile-image">
          <img alt="Profile Picture" src="{{ uploadedProfilePicture }}" title="Profile Picture" class="center" />
        </div>
        <!-- input for file upload -->
        <div class="com-w-full">
          <div class="image-text-details">
            <input (change)="displaySelectedProfileImage($event)" type="file" accept="image/*" class="image-input" />
            <div class="com-text-center com-absolute com-top-8 com-right-0 com-left-0 com-m-auto com-text-gray-400">
              <fa-icon [icon]="faFileImage" class="com-text-5xl"></fa-icon>
              <p>
                Drag file here
                <br />
                or<span class="com-text-primary-500"> BROWSE </span>
              </p>
            </div>
          </div>
        </div>
      </div>
      <commudle-alert [info]="true" message="Images should be less than 2MB"></commudle-alert>
    </div>
  </div>
  <div class="row">
    <div>
      <label class="name">
        Name<span class="mandatory-field">*</span>
        <input formControlName="name" shape="semi-round" fullWidth nbInput type="text" />
      </label>
      <span
        *ngIf="
          basicInfoForm['controls'].name.touched &&
          basicInfoForm['controls'].name.invalid &&
          basicInfoForm['controls'].name.errors.required
        "
      >
        <commudle-alert [error]="true" [errorMessage]="'Required Field'"></commudle-alert>
      </span>
    </div>
  </div>

  <div class="row">
    <div>
      <label class="tagline">
        Designation/ Tagline<span class="mandatory-field">*</span>
        <input
          formControlName="designation"
          fullWidth
          nbInput
          shape="semi-round"
          placeholder="Blogger, Developer, Designer"
          type="text"
        />
      </label>
      <span
        *ngIf="
          basicInfoForm['controls'].designation.touched &&
          basicInfoForm['controls'].designation.invalid &&
          basicInfoForm['controls'].designation.errors.required
        "
      >
        <commudle-alert [error]="true" [errorMessage]="'Required Field'"></commudle-alert>
      </span>
      <commudle-alert
        [error]="basicInfoForm.get('designation').errors?.['maxlength']"
        errorMessage="Max characters should be 100"
      >
      </commudle-alert>
    </div>
  </div>

  <div class="row">
    <div>
      <label class="location">
        Location<span class="mandatory-field">*</span>
        <input
          #autocompleteInput
          shape="semi-round"
          formControlName="location"
          fullWidth
          nbInput
          placeholder="Where are you from?"
          type="text"
        />
      </label>
    </div>
  </div>

  <div class="row">
    <div>
      <label class="about">
        About Me<span class="mandatory-field">*</span>
        <textarea
          formControlName="about_me"
          shape="semi-round"
          fullWidth
          nbInput
          placeholder="A little bit about your interests! (max 1000 characters)"
          rows="3"
        ></textarea>
      </label>
      <span
        *ngIf="
          (basicInfoForm['controls'].about_me.touched || basicInfoForm.get('about_me').value) &&
          basicInfoForm['controls'].about_me.invalid
        "
      >
        <commudle-alert [error]="true" [errorMessage]="'Required field. Maximum 1000 characters.'"></commudle-alert>
      </span>
    </div>
  </div>

  <div class="row">
    <div class="gender-input">
      <label class="gender">
        Gender
        <nb-radio-group formControlName="gender" name="gender" class="com-flex">
          <nb-radio value="male" class="!com-flex">Male</nb-radio>
          <nb-radio value="female" class="!com-flex">Female</nb-radio>
          <nb-radio value="prefer_not_to_answer" class="!com-flex">Other/Prefer Not To answer</nb-radio>
        </nb-radio-group>
      </label>
    </div>
  </div>
</form>
