<form [formGroup]="basicInfoForm">
  <div class="row">
    <div>
      <div class="profile-upload-container">
        <div *ngIf="uploadedProfilePicture === null" class="uploaded-profile"></div>
        <div *ngIf="uploadedProfilePicture" class="uploaded-profile-image">
          <img alt="Profile Picture" src="{{ uploadedProfilePicture }}" title="Profile Picture" class="center" />
        </div>
        <!-- input for file upload -->
        <div class="upload-wrapper">
          <div class="image-text-details">
            <input
              (change)="displaySelectedProfileImage($event)"
              type="file"
              accept="image/png,image/jpeg,image/jpg,image/webp,image/heif,image/heic"
              class="image-input"
            />
            <label class="upload-area">
              <div class="upload-content">
                <button nbButton class="upload-picture" size="small" shape="semi-round">Upload Picture</button>
                <p class="file-info">Accepted file types: JPG, JPEG, PNG, WebP, HEIF</p>
                <p class="file-info">Max file size 2MB</p>
              </div>
            </label>
          </div>
        </div>
      </div>
      <commudle-alert [info]="true" message="Images should be less than 2MB"></commudle-alert>
    </div>
  </div>
  <div class="row">
    <div>
      <label class="name">
        Name<span class="mandatory-field">*</span>
        <input formControlName="name" shape="semi-round" fullWidth nbInput type="text" />
      </label>
      <span
        *ngIf="
          basicInfoForm['controls'].name.touched &&
          basicInfoForm['controls'].name.invalid &&
          basicInfoForm['controls'].name.errors.required
        "
      >
        <commudle-alert [error]="true" [errorMessage]="'Required Field'"></commudle-alert>
      </span>
    </div>
  </div>

  <div class="row">
    <div>
      <label class="tagline">
        Designation/ Tagline<span class="mandatory-field">*</span>
        <input
          formControlName="designation"
          fullWidth
          nbInput
          shape="semi-round"
          placeholder="Blogger, Developer, Designer"
          type="text"
        />
      </label>
      <span
        *ngIf="
          basicInfoForm['controls'].designation.touched &&
          basicInfoForm['controls'].designation.invalid &&
          basicInfoForm['controls'].designation.errors.required
        "
      >
        <commudle-alert [error]="true" [errorMessage]="'Required Field'"></commudle-alert>
      </span>
      <commudle-alert
        [error]="basicInfoForm.get('designation').errors?.['maxlength']"
        errorMessage="Max characters should be 100"
      >
      </commudle-alert>
    </div>
  </div>

  <div class="row">
    <div>
      <label class="location">
        Location<span class="mandatory-field">*</span>
        <input
          #autocompleteInput
          shape="semi-round"
          formControlName="location"
          fullWidth
          nbInput
          placeholder="Where are you from?"
          type="text"
        />
      </label>
      <span
        *ngIf="
          (basicInfoForm['controls'].location.touched || basicInfoForm.get('location').value) &&
          basicInfoForm['controls'].location.invalid
        "
      >
        <commudle-alert [error]="true" [errorMessage]="'Required field'"></commudle-alert>
      </span>
    </div>
  </div>

  <div class="row">
    <div>
      <label class="about">
        About Me<span class="mandatory-field">*</span>
        <textarea
          formControlName="about_me"
          shape="semi-round"
          fullWidth
          nbInput
          placeholder="A little bit about your interests! (max 2600 characters)"
          rows="3"
        ></textarea>
      </label>
      <span
        *ngIf="
          (basicInfoForm['controls'].about_me.touched || basicInfoForm.get('about_me').value) &&
          basicInfoForm['controls'].about_me.invalid &&
          basicInfoForm['controls'].about_me.errors.required
        "
      >
        <commudle-alert [error]="true" [errorMessage]="'Required field'"></commudle-alert>
      </span>
      <span
        *ngIf="
          (basicInfoForm['controls'].about_me.touched || basicInfoForm.get('about_me').value) &&
          basicInfoForm['controls'].about_me.invalid &&
          basicInfoForm['controls'].about_me.errors.minlength
        "
      >
        <commudle-alert [error]="true" [errorMessage]="'Minimum 30 characters required'"></commudle-alert>
      </span>
      <span
        *ngIf="
          (basicInfoForm['controls'].about_me.touched || basicInfoForm.get('about_me').value) &&
          basicInfoForm['controls'].about_me.invalid &&
          basicInfoForm['controls'].about_me.errors.maxlength
        "
      >
        <commudle-alert [error]="true" [errorMessage]="'Maximum 2600 characters allowed'"></commudle-alert>
      </span>
    </div>
  </div>

  <div class="row">
    <div class="gender-input">
      <label class="gender">
        Gender<span class="mandatory-field">*</span>
        <nb-radio-group formControlName="gender" name="gender" class="com-flex">
          <nb-radio value="male" class="!com-flex">Male</nb-radio>
          <nb-radio value="female" class="!com-flex">Female</nb-radio>
          <nb-radio value="prefer_not_to_answer" class="!com-flex">Other/Prefer Not To answer</nb-radio>
        </nb-radio-group>
      </label>
      <span
        *ngIf="
          (basicInfoForm['controls'].gender.touched || basicInfoForm.get('gender').value) &&
          basicInfoForm['controls'].gender.invalid
        "
      >
        <commudle-alert [error]="true" [errorMessage]="'Required field'"></commudle-alert>
      </span>
    </div>
  </div>
</form>
