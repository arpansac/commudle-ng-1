<div class="base-layout">
  <div class="container">
    <div class="one-column-layout">
      <nb-card>
        <nb-card-body>
          <div class="campaign-stats-container" *ngIf="campaignStats">
            <div class="campaign-stats-item">
              <div class="campaign-stats-item-label">Total Views:</div>
              <div class="campaign-stats-item-value">{{ campaignStats.total_views }}</div>
            </div>
            <div class="campaign-stats-item">
              <div class="campaign-stats-item-label">Total Clicks:</div>
              <div class="campaign-stats-item-value">{{ campaignStats.total_clicks }}</div>
            </div>
          </div>

          <div class="graph-container">
            <div class="campaign-graph-container">
              <h2 class="title">Views Over Days</h2>
              <div class="chart-container">
                <canvas #viewsOverDays></canvas>
              </div>
            </div>
            <div class="campaign-graph-container">
              <h2 class="title">Clicks Over Days</h2>
              <div class="chart-container">
                <canvas #clicksOverDays></canvas>
              </div>
            </div>
          </div>

          <div class="graph-container">
            <div class="campaign-graph-container">
              <h2 class="title">Views Over Time</h2>
              <div class="chart-container">
                <canvas #viewsOverTime></canvas>
              </div>
            </div>

            <div class="campaign-graph-container">
              <h2 class="title">Clicks Over Time</h2>
              <div class="chart-container">
                <canvas #clicksOverTime></canvas>
              </div>
            </div>
          </div>

          <div *ngIf="campaignStats">
            <h2>User Tags</h2>
            <div>
              <nb-tag-list>
                <nb-tag
                  status="info"
                  appearance="outline"
                  *ngFor="let tag of this.campaignStats.user_tags.tags"
                  text="{{ tag[0] }} ({{ tag[1] }})"
                  [removable]="false"
                ></nb-tag>
              </nb-tag-list>
            </div>
          </div>
        </nb-card-body>
      </nb-card>
    </div>
  </div>
</div>
