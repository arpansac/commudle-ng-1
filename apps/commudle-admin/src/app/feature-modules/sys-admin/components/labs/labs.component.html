<div class="base-layout">
  <div class="container">
    <div class="one-column-layout">
      <nb-card class="labs">
        <nb-card-header>
          <h4>Labs</h4>
          <div class="select">
            <select id="labStatusSelect" [(ngModel)]="selectedStatus" (change)="onStatusChange($event)">
              <option *ngFor="let status of publishStatuses" [value]="status">{{ EPublishStatus[status] }}</option>
            </select>
          </div>
        </nb-card-header>
        <nb-card-body>
          <div *ngIf="isLoading">
            <app-loading-spinner></app-loading-spinner>
          </div>
          <div *ngIf="!isLoading && labs.length === 0">
            <p>No labs found</p>
          </div>
          <div *ngFor="let lab of labs" class="lab">
            <div class="content">
              <p>
                <small> {{ lab.created_since }} ago </small>
              </p>
              <h5>
                {{ lab.name }}
                <a [routerLink]="['/labs', lab.slug]" target="_blank">
                  <nb-icon icon="external-link" status="primary"></nb-icon>
                </a>
              </h5>
              <!-- <p>{{ lab.user.name }} &lt;{{ lab.user.email }}&gt;</p> -->
              <app-user-profile-card-small [user]="lab.user"></app-user-profile-card-small>
              <small>{{ lab.user.email }}</small>
            </div>
            <div class="stats">
              <div>
                <app-votes-display [icon]="'star'" [votableId]="lab.id" [votableType]="'Lab'"></app-votes-display>
              </div>
              <div class="tags">
                <app-tag
                  [tags]="lab.tags"
                  size="tiny"
                  [backgroundColor]="'com-bg-[#F6F9FC]'"
                  [fontColor]="'com-text-tYankees-Blue'"
                ></app-tag>
              </div>
            </div>
            <div class="actions">
              <div class="status-update">
                <nb-select
                  (selectedChange)="updatePublishStatus($event, lab.id)"
                  [selected]="lab.publish_status"
                  placeholder="Select Status"
                  size="small"
                  status="primary"
                >
                  <nb-option *ngFor="let ps of publishStatuses" [value]="EPublishStatus[ps]">
                    {{ EPublishStatus[ps] }}
                  </nb-option>
                </nb-select>
              </div>
              <div>
                <button [routerLink]="['/labs', lab.slug, 'edit']" nbButton outline size="tiny" status="info">
                  Edit
                </button>
              </div>
            </div>
          </div>
        </nb-card-body>
      </nb-card>
      <div class="pagination">
        <app-pagination
          (goTo)="page = $event; getLabs()"
          (next)="page = $event; getLabs()"
          (previous)="page = $event; getLabs()"
          *ngIf="total > 0"
          [count]="count"
          [current]="page"
          [total]="total"
        ></app-pagination>
      </div>
    </div>
  </div>
</div>
