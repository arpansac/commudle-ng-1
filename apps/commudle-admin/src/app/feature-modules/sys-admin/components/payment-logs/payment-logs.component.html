<div class="base-layout">
  <div class="container">
    <div class="one-column-layout">
      <nb-card>
        <nb-card-header>
          <h1>Forms List</h1>
        </nb-card-header>
        <nb-card-body>
          <div class="com-flex com-justify-between">
            <button nbButton status="primary" (click)="openDialog(manuallyAddPayment)">Link payment manually</button>
            <button nbButton status="info" (click)="openPaymentInfoDialog(fetchPaymentInfoDialog)" outline>
              Fetch payment info
            </button>
          </div>
          <commudle-paid-form-list></commudle-paid-form-list> </nb-card-body
      ></nb-card>
    </div>
  </div>
</div>

<ng-template #manuallyAddPayment let-ref="dialogRef">
  <nb-card>
    <nb-card-header>
      <span>Add Payment Details</span>
      <button ghost nbButton size="small" (click)="ref.close()">
        <nb-icon icon="close"></nb-icon>
      </button>
    </nb-card-header>
    <nb-card-body>
      <div>
        <label for="payment_id"
          ><div>Payment Id from razorpay</div>
          <br />
          <input [(ngModel)]="rzpPaymentId" nbInput type="text" id="payment_id" placeholder="Razorpay Payment id" />
        </label>
      </div>
    </nb-card-body>
    <nb-card-footer>
      <button nbButton status="primary" (click)="createPayment(); ref.close()">Submit</button>
    </nb-card-footer>
  </nb-card>
</ng-template>

<ng-template #fetchPaymentInfoDialog let-ref="dialogRef">
  <nb-card class="com-w-[800px] com-max-h-[90vh]">
    <nb-card-header>
      <span>Fetch Payment Info</span>
      <button ghost nbButton size="small" (click)="ref.close()">
        <nb-icon icon="close"></nb-icon>
      </button>
    </nb-card-header>
    <nb-card-body class="com-max-h-[calc(90vh-150px)] com-overflow-y-auto">
      <div class="com-flex com-gap-4 com-items-end">
        <div>
          <label for="fetch_payment_id">
            <div>Payment Id from Razorpay</div>
            <br />
            <input
              [(ngModel)]="rzpPaymentId"
              nbInput
              type="text"
              id="fetch_payment_id"
              placeholder="Razorpay Payment id"
            />
          </label>
        </div>
        <label class="com-flex com-items-center com-gap-2 com-cursor-pointer">
          <input type="checkbox" [(ngModel)]="fromApi" class="com-w-4 com-h-4" />
          <span>Fetch from API</span>
        </label>
      </div>
      <div *ngIf="isLoading" class="com-mt-4 com-text-center">
        <app-loading-spinner></app-loading-spinner>
      </div>
      <div *ngIf="paymentInfo && !isLoading" class="com-mt-4">
        <h5>Payment Information:</h5>
        <pre class="com-bg-gray-100 com-p-4 com-rounded com-overflow-x-auto">{{ paymentInfo | json }}</pre>
      </div>
    </nb-card-body>
    <nb-card-footer>
      <button nbButton status="primary" (click)="fetchPaymentInfo(fromApi)" [disabled]="isLoading">Fetch Info</button>
    </nb-card-footer>
  </nb-card>
</ng-template>
