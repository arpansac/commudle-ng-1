<div class="base-layout">
  <div class="container">
    <div class="one-column-layout">
      <div class="com-flex com-justify-center com-gap-4">
        <button [routerLink]="['/admin/orgs/create']" nbButton status="primary">
          <nb-icon icon="plus"></nb-icon>
          Create Community Group
        </button>

        <button [routerLink]="['/admin/communities/new']" nbButton status="primary">
          <nb-icon icon="plus"></nb-icon>
          Create Community
        </button>

        <button [routerLink]="['profanity']" nbButton status="primary">Profanity</button>
        <button [routerLink]="['campaigns']" nbButton status="primary">
          <fa-icon [icon]="icons.faRectangleAd"></fa-icon>
          &nbsp; Campaigns
        </button>
      </div>
    </div>
  </div>
</div>
