<app-loading-spinner *ngIf="isLoading"></app-loading-spinner>

<ng-container *ngIf="!isLoading">
  <ng-container *ngIf="plans.length > 0; else empty">
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Plan ID</th>
            <th>Name</th>
            <th>Amount</th>
            <th>Currency</th>
            <th>Period</th>
            <th>Interval</th>
            <th>Created At</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let plan of plans">
            <td>
              <code class="plan-id">{{ plan.id }}</code>
            </td>
            <td class="product-name">{{ plan.item?.name }}</td>
            <td class="amount-cell">{{ getAmount(plan) }}</td>
            <td>{{ plan.item?.currency }}</td>
            <td>
              <span class="period-badge">{{ plan.period | titlecase }}</span>
            </td>
            <td>{{ plan.interval }}</td>
            <td>{{ formatDate(plan.created_at) }}</td>
          </tr>
        </tbody>
      </table>
    </div>

    <app-pagination
      *ngIf="total > count"
      [current]="page"
      [count]="count"
      [total]="total"
      (goTo)="page = $event; fetchPlans()"
      (next)="page = $event; fetchPlans()"
      (previous)="page = $event; fetchPlans()"
    ></app-pagination>
  </ng-container>

  <ng-template #empty>
    <div class="empty-state">
      <nb-icon icon="credit-card-outline"></nb-icon>
      <p>No Razorpay plans found.</p>
    </div>
  </ng-template>
</ng-container>
