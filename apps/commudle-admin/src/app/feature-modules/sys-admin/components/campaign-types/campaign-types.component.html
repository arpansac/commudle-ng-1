<div class="base-layout">
  <div class="container">
    <div class="one-column-layout">
      <nb-card>
        <nb-card-header>
          <span>Campaign Types</span>
          <div>
            <button (click)="openDialog(campaignFormDialog)" ghost nbButton shape="round" size="small">
              <nb-icon icon="plus"></nb-icon>
              Create New Campaign Type
            </button>
          </div>
        </nb-card-header>
        <nb-card-body>
          <app-loading-spinner *ngIf="isLoading; else campaignType"></app-loading-spinner>
          <ng-template #campaignType>
            <table>
              <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Active</th>
                <th>User</th>
                <th [width]="200">Action</th>
              </tr>
              <tr *ngFor="let campaignType of campaignTypes">
                <td>{{ campaignType.name }}</td>
                <td>{{ campaignType.description }}</td>
                <td>
                  <nb-toggle [checked]="campaignType.active" (checkedChange)="toggleCampaignStatus(campaignType.id)">
                  </nb-toggle>
                </td>
                <td>
                  <app-user-profile-mini [user]="campaignType.user" size="small"></app-user-profile-mini>
                </td>
                <td>
                  <button nbButton size="tiny" status="info" (click)="openDialog(campaignFormDialog, campaignType)">
                    <fa-icon [icon]="icons.faEdit"></fa-icon> &nbsp; Edit
                  </button>
                  &nbsp;
                  <button nbButton size="tiny" status="danger" (click)="openDialog(destroyConfirmation, campaignType)">
                    <fa-icon [icon]="icons.faTrash"></fa-icon> &nbsp;Delete
                  </button>
                </td>
              </tr>
            </table>
          </ng-template>
        </nb-card-body>
      </nb-card>
    </div>
  </div>
</div>

<ng-template #campaignFormDialog let-data let-ref="dialogRef">
  <nb-card class="campaign-form dialog-box">
    <nb-card-header>
      <div>{{ data.campaignType ? 'Edit ' + data.campaignType.name : 'New' }}</div>
      <button ghost nbButton size="small" (click)="ref.close()" shape="round">
        <nb-icon icon="close"></nb-icon>
      </button>
    </nb-card-header>
    <nb-card-body>
      <form (ngSubmit)="create()" [formGroup]="campaignTypeForm">
        <div>
          <label>
            Name
            <span class="required">*</span>
            <input formControlName="name" nbInput type="text" fullWidth placeholder="Name"
          /></label>
        </div>
        <commudle-alert
          *ngIf="
            campaignTypeForm.controls['name'].touched &&
            campaignTypeForm.controls['name'].hasError('required') &&
            campaignTypeForm.controls['name'].invalid
          "
          errorMessage="Name is Required"
          [error]="true"
        ></commudle-alert>
        <br />
        <div>
          <label>
            Description
            <span class="required">*</span>
            <textarea formControlName="description" nbInput type="text" fullWidth placeholder="Description"></textarea>
          </label>
        </div>
        <commudle-alert
          *ngIf="
            campaignTypeForm.controls['description'].touched &&
            campaignTypeForm.controls['description'].hasError('required') &&
            campaignTypeForm.controls['description'].invalid
          "
          errorMessage="Description is Required"
          [error]="true"
        ></commudle-alert>
        <br />
        <nb-toggle formControlName="active" labelPosition="left"> Active <span class="required">*</span></nb-toggle>
      </form>
    </nb-card-body>
    <nb-card-footer>
      <button
        nbButton
        status="primary"
        (click)="data.campaignType ? update(data.campaignType.id) : create(); ref.close()"
        [disabled]="!campaignTypeForm.valid"
      >
        {{ data.campaignType ? 'Update' : 'Create' }}
      </button>
      <button nbButton status="danger" (click)="ref.close()">cancel</button>
    </nb-card-footer>
  </nb-card>
</ng-template>

<ng-template #destroyConfirmation let-data let-ref="dialogRef">
  <nb-card class="dialog-box">
    <nb-card-header>
      <div>Delete</div>
      <button ghost nbButton size="small" (click)="ref.close()" shape="round">
        <nb-icon icon="close"></nb-icon>
      </button>
    </nb-card-header>
    <nb-card-body>
      <div>
        Are you sure you want to delete <Strong>{{ campaignTypeForm.get('name').value }} </Strong> campaign type?
      </div>
    </nb-card-body>
    <nb-card-footer>
      <button nbButton status="danger">Delete</button>
      <button nbButton status="info" (click)="ref.close()">cancel</button>
    </nb-card-footer>
  </nb-card>
</ng-template>
