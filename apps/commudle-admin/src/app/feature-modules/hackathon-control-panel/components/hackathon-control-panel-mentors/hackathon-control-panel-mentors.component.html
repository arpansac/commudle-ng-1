<nb-card>
  <nb-card-header>
    <div class="header">Mentor Assignment</div>
  </nb-card-header>
  <nb-card-body>
    <div class="round-selector">
      <label>Select Round:</label>
      <select
        #roundSelect
        (change)="onRoundChange(+roundSelect.value)"
        [disabled]="isLoading"
        [value]="selectedRound?.id"
      >
        <option value="">-- Select a Round --</option>
        <option *ngFor="let round of rounds" [value]="round.id" [selected]="selectedRound?.id === round.id">
          {{ round.name }}
        </option>
      </select>
      <button
        nbButton
        status="primary"
        size="small"
        (click)="shiftTeamsToNextRound()"
        [disabled]="!selectedRound || isLoading"
      >
        <fa-icon [icon]="icons.faArrowRight"></fa-icon>
        Shift All Teams to Next Round
      </button>
    </div>

    <div *ngIf="isLoading" class="loading-spinner">
      <nb-spinner></nb-spinner>
    </div>

    <div *ngIf="!isLoading && selectedRound && mentors.length > 0">
      <table>
        <thead>
          <tr>
            <th>Mentor</th>
            <th>Assigned Teams</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let mentor of mentors">
            <td class="mentor-cell">
              <div class="mentor-info">
                <img *ngIf="mentor.photo?.url" [src]="mentor.photo.url" [alt]="mentor.name" />
                <div>
                  <div class="mentor-name">{{ mentor.name }}</div>
                  <div class="mentor-designation">{{ mentor.designation }} at {{ mentor.company }}</div>
                </div>
              </div>
            </td>
            <td class="teams-cell">
              <div class="team-tags">
                <nb-tag
                  *ngFor="let team of getAssignedTeams(mentor.id)"
                  status="success"
                  [removable]="true"
                  (remove)="removeTeamFromMentor(mentor.id, team.id)"
                  [text]="team.name"
                >
                </nb-tag>
                <span *ngIf="getAssignedTeams(mentor.id).length === 0" class="no-teams">No teams assigned</span>
              </div>
            </td>
            <td class="actions-cell">
              <select #teamSelect (change)="addTeamToMentor(mentor.id, +teamSelect.value); teamSelect.value = ''">
                <option value="">Add Team</option>
                <option *ngFor="let team of getUnassignedTeams(mentor.id)" [value]="team.id">
                  {{ team.name }}
                </option>
              </select>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div *ngIf="!isLoading && selectedRound && mentors.length === 0" class="no-mentors">
      <p>No mentors found. Please add mentors from the "Judges, Speakers & Mentors" section.</p>
    </div>

    <div *ngIf="!selectedRound && !isLoading" class="select-round-message">
      <p>Please select a round to view and assign teams to mentors.</p>
    </div>
  </nb-card-body>
</nb-card>
