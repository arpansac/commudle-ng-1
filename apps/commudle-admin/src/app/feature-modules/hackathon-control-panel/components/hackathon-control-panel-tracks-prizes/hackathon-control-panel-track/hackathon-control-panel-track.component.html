<br />
<button (click)="openSponsorDialogBox(addTracksDialogBox)" nbButton status="primary">
  <fa-icon [icon]="icons.faPlus"></fa-icon> &nbsp; Add Track
</button>
<br />
<br />
<app-loading-spinner *ngIf="isLoading"></app-loading-spinner>

<nb-card *ngIf="hackathonTracks && hackathonTracks.length > 0; else noTracks">
  <nb-card-body>
    <table class="hackathon-tracks-table">
      <thead>
        <tr>
          <th>Track Name</th>
          <th>Description</th>
          <th>Problem Statements</th>
          <th>Prizes</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let hackathonTrack of hackathonTracks; let i = index">
          <td>{{ hackathonTrack.name }}</td>
          <td>
            <div class="description-scroll custom-scrollbar" [innerHTML]="hackathonTrack.description"></div>
          </td>
          <td>
            <div *ngIf="hackathonTrack.hackathon_problem_statements?.length; else addProblemStatements">
              <button (click)="openSponsorDialogBox(addTracksDialogBox, hackathonTrack, i)" class="problem-count-btn">
                {{ hackathonTrack.hackathon_problem_statements.length }}
              </button>
            </div>
            <ng-template #addProblemStatements>
              <button
                (click)="openSponsorDialogBox(addTracksDialogBox, hackathonTrack, i)"
                nbButton
                size="tiny"
                status="primary"
              >
                Add Problem Statements
              </button>
            </ng-template>
          </td>
          <td>
            <div *ngIf="hackathonTrack.hackathon_prizes?.length; else addPrizes">
              {{ hackathonTrack.hackathon_prizes.length }} Prize
            </div>
            <ng-template #addPrizes>
              <button (click)="prizeDialogBox(hackathonTrack.id)" nbButton size="tiny" status="primary">
                Add Prize
              </button>
            </ng-template>
          </td>
          <td>
            <button
              (click)="openSponsorDialogBox(addTracksDialogBox, hackathonTrack, i)"
              nbButton
              size="tiny"
              status="info"
              class="action-btn"
              title="Edit Track"
            >
              Edit Track
            </button>
            <button
              nbButton
              size="tiny"
              status="success"
              class="action-btn"
              title="Add Prize"
              (click)="prizeDialogBox(hackathonTrack.id)"
            >
              Add Prize
            </button>
            <button
              (click)="openSponsorDialogBox(addTracksDialogBox, hackathonTrack, i)"
              nbButton
              size="tiny"
              status="warning"
              class="action-btn"
              title="Edit Problem Statements"
            >
              Edit PS
            </button>
            <button
              (click)="confirmDeleteDialogBox(deleteTrackDilaogBox, hackathonTrack.id, i)"
              nbButton
              size="tiny"
              status="danger"
              class="action-btn"
              title="Delete"
            >
              Delete
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </nb-card-body>
</nb-card>
<ng-template #noTracks>
  <br />
  <br />

  <div *ngIf="!isLoading">No Tracks Added</div>
</ng-template>

<ng-template #addTracksDialogBox let-data let-ref="dialogRef">
  <nb-card class="track-form">
    <nb-card-header>
      <span> {{ data.track ? 'Edit Track' : 'New Track' }}</span>
      <button (click)="ref.close()" ghost nbButton shape="round" size="small">
        <nb-icon icon="close"></nb-icon>
      </button>
    </nb-card-header>
    <nb-card-body>
      <form [formGroup]="trackForm">
        <!-- name -->
        <div>
          <label for="name">Name *</label>
          <input formControlName="name" fullWidth id="name" nbInput placeholder="Name" type="text" />
          <commudle-alert
            *ngIf="
              trackForm.controls['name'].invalid &&
              trackForm.controls['name'].touched &&
              trackForm.controls['name'].hasError('required')
            "
            [error]="true"
            errorMessage="Name is required"
          ></commudle-alert>
        </div>

        <!-- Description -->
        <div>
          <label for="description">Description *</label>
          <editor [init]="tinyMCE" formControlName="description" id="description"></editor>
          <commudle-alert
            *ngIf="
              trackForm.controls['description'].invalid &&
              trackForm.controls['description'].touched &&
              trackForm.controls['description'].hasError('required')
            "
            [error]="true"
            errorMessage="Description is required"
          ></commudle-alert>
        </div>

        <!-- Problem Statements -->
        <div>
          <div class="problem-statements-header">
            <label>Problem Statements</label>
            <button (click)="addProblemStatement()" nbButton size="small" status="primary" type="button">
              <fa-icon [icon]="icons.faPlus"></fa-icon>&nbsp; Add Problem Statement
            </button>
          </div>

          <div formArrayName="problem_statements">
            <div
              *ngFor="let problemStatement of problemStatements.controls; let i = index"
              [formGroupName]="i"
              class="problem-statement-item"
            >
              <div class="problem-statement-fields">
                <!-- <div class="field-group">
                  <label [for]="'display_id_' + i">Display ID</label>
                  <input [id]="'display_id_' + i" formControlName="display_id" fullWidth nbInput readonly type="text" />
                </div> -->

                <div class="field-group">
                  <label [for]="'title_' + i"
                    >({{ problemStatement.get('display_id')?.value }}) Problem Statement</label
                  >
                  <editor [init]="tinyMCE" [id]="'title_' + i" formControlName="title"></editor>
                  <commudle-alert
                    *ngIf="
                      problemStatement.get('title')?.invalid &&
                      problemStatement.get('title')?.touched &&
                      problemStatement.get('title')?.hasError('minlength')
                    "
                    [error]="true"
                    errorMessage="Problem Statement must be at least 60 characters long"
                  ></commudle-alert>
                </div>

                <div class="field-group">
                  <label [for]="'max_teams_limit_' + i">Max No. of Teams Allow to Choose This Problem Statement</label>
                  <input
                    [id]="'max_teams_limit_' + i"
                    formControlName="max_teams_limit"
                    fullWidth
                    nbInput
                    placeholder="Maximum number of teams (optional)"
                    type="number"
                    min="1"
                  />
                  <commudle-alert
                    *ngIf="
                      problemStatement.get('max_teams_limit')?.invalid &&
                      problemStatement.get('max_teams_limit')?.touched &&
                      problemStatement.get('max_teams_limit')?.hasError('min')
                    "
                    [error]="true"
                    errorMessage="Max teams limit must be at least 1"
                  ></commudle-alert>
                </div>
              </div>

              <button
                *ngIf="problemStatements.length > 0"
                (click)="removeProblemStatement(i)"
                nbButton
                size="small"
                status="danger"
                type="button"
                class="remove-button"
              >
                <fa-icon [icon]="icons.faMinus"></fa-icon>
              </button>
            </div>
          </div>
        </div>
      </form>
    </nb-card-body>
    <nb-card-footer>
      <button
        (click)="data.track ? updateTrack(data.track.id, data.index) : createTrack(); ref.close()"
        [disabled]="trackForm.invalid || !trackForm.dirty"
        fullWidth
        nbButton
        status="primary"
      >
        {{ data.track ? 'Update' : 'Save' }}
      </button>
    </nb-card-footer>
  </nb-card>
</ng-template>

<ng-template #deleteTrackDilaogBox let-data let-ref="dialogRef">
  <nb-card>
    <nb-card-header>
      <span>Confirm delete track</span>
      <button (click)="ref.close()" ghost nbButton shape="round" size="small">
        <nb-icon icon="close"></nb-icon>
      </button>
    </nb-card-header>
    <nb-card-body>Are you sure, you want to delete track?</nb-card-body>
    <nb-card-footer>
      <button (click)="destroyTrack(data.trackId, data.index); ref.close()" nbButton status="primary">Delete</button>
      <button (click)="ref.close()" nbButton outline status="danger">Cancel</button>
    </nb-card-footer>
  </nb-card>
</ng-template>
