<nb-card class="communication-section">
  <nb-card-header>
    <div class="header-section">
      <h2 class="page-title">Communications</h2>
      <commudle-help-section [helpDictionaryName]="'hackathon-communications'"></commudle-help-section>
    </div>
  </nb-card-header>
  <nb-card-body>
    <div class="email-sections">
      <div class="email-section">
        <div class="section-header">
          <h3 class="section-title">Registration Management</h3>
        </div>
        <div class="action-buttons">
          <button nbButton status="primary" (click)="openDialogBox(SendRegistrationsByMail)">
            <fa-icon [icon]="icons.faEnvelope"></fa-icon>
            &nbsp; Send Registration Invite
          </button>
          <button nbButton status="danger" (click)="openDialogBox(SendRejectionEmails)">
            <fa-icon [icon]="icons.faTimes"></fa-icon>
            &nbsp; Send Rejection Emails
          </button>
        </div>
      </div>

      <div class="email-section">
        <div class="section-header">
          <h3 class="section-title">Winner Announcements</h3>
        </div>
        <div class="action-buttons">
          <button nbButton status="success" (click)="openDialogBoxForWinnerAnnouncement(hackathonId)">
            <fa-icon [icon]="icons.faTrophy"></fa-icon>
            &nbsp; Send Winner Announcement
          </button>
        </div>
      </div>

      <div class="email-section">
        <div class="section-header">
          <h3 class="section-title">General Mailer</h3>
        </div>
        <div class="action-buttons">
          <button nbButton status="primary" (click)="openDialogBoxForStatusFilterGeneralEmail(hackathonId)">
            <fa-icon [icon]="icons.faFilter"></fa-icon>
            &nbsp; Status Filter General Email
          </button>
          <button nbButton status="primary" (click)="openDialogBoxForRoundGeneralEmail(hackathonId)">
            <fa-icon [icon]="icons.faBullhorn"></fa-icon>
            &nbsp; Round General Email
          </button>
        </div>
      </div>
    </div>
  </nb-card-body>
</nb-card>

<ng-template #SendRegistrationsByMail let-ref="dialogRef">
  <nb-card class="mail-popup">
    <nb-card-header>
      <span>Registration Invite Email</span>
      <button nbButton size="small" shape="round" (click)="closeDialogBox()" ghost>
        <nb-icon icon="close"></nb-icon>
      </button>
    </nb-card-header>
    <nb-card-body>
      <commudle-alert
        [info]="true"
        message="This will send a pre-formatted email and a notification to all members of the community"
      ></commudle-alert>
      <div class="message-field">
        <label for="message" class="message">Message (Optional)</label>
        <editor [init]="tinyMCE" [(ngModel)]="message"></editor>
      </div>
    </nb-card-body>
    <nb-card-footer>
      <button
        (click)="previewEmail(hackathonId); showPreviewSpinner = true"
        nbButton
        status="primary"
        shape="semi-round"
        [nbSpinner]="showPreviewSpinner"
        type="button"
      >
        <fa-icon [icon]="icons.faEye"></fa-icon>
        &nbsp; Preview Email
      </button>
      <button
        nbButton
        status="primary"
        shape="semi-round"
        fullWidth
        (click)="SendRegistrationsMailer()"
        [nbSpinner]="isLoading"
        [disabled]="isLoading"
      >
        <fa-icon [icon]="icons.faPaperPlane"></fa-icon>
        &nbsp; Send
      </button>
    </nb-card-footer>
  </nb-card>
</ng-template>

<ng-template #SendRejectionEmails let-ref="dialogRef">
  <nb-card class="mail-popup">
    <nb-card-header>
      <span>Send Rejection Emails</span>
      <button nbButton size="small" shape="round" (click)="closeDialogBox()" ghost>
        <nb-icon icon="close"></nb-icon>
      </button>
    </nb-card-header>
    <nb-card-body>
      <commudle-alert [info]="true" message="This will send rejection emails to all rejected teams"></commudle-alert>
      <div class="message-field">
        <label for="message" class="message">Message (Optional)</label>
        <editor [init]="tinyMCE" [(ngModel)]="message"></editor>
      </div>
    </nb-card-body>
    <nb-card-footer>
      <button
        (click)="previewRejectionEmail(hackathonId); showPreviewSpinner = true"
        nbButton
        status="primary"
        shape="semi-round"
        [nbSpinner]="showPreviewSpinner"
        type="button"
      >
        <fa-icon [icon]="icons.faEye"></fa-icon>
        &nbsp; Preview Email
      </button>
      <button
        nbButton
        status="primary"
        shape="semi-round"
        fullWidth
        (click)="sendRejectionEmails()"
        [nbSpinner]="isLoading"
        [disabled]="isLoading"
      >
        <fa-icon [icon]="icons.faPaperPlane"></fa-icon>
        &nbsp; Send
      </button>
    </nb-card-footer>
  </nb-card>
</ng-template>
