<div class="team-assignments-compact">
  @if(slotAssignment?.count > 0) {
  <div class="team-cell-wrapper" (click)="onSlotClick()">
    <div class="team-count-badge">
      {{ slotAssignment.count }}
    </div>
    <div class="team-summary custom-scrollbar">
      @for(team of slotAssignment.assignedTeams; track team.id) {
      <span class="team-name">{{ team.name }}</span>
      }
    </div>
  </div>
  } @else {
  <div class="no-teams-actions">
    <button class="no-teams-compact add-btn" (click)="onSlotClick()">
      <fa-icon [icon]="icons.faPlus"></fa-icon> {{ slotUUID }}
      Add teams
    </button>
    <button class="no-teams-compact cancel-btn" (click)="onCancelSlot($event)">
      <fa-icon [icon]="icons.faXmark"></fa-icon>
      Cancel slot
    </button>
  </div>
  }
</div>

<ng-template #cancelConfirmDialog let-data let-ref="dialogRef">
  <nb-card class="dialog-box-card">
    <nb-card-header>
      <div>Cancel Slot</div>
      <button ghost nbButton size="small" (click)="ref.close(false)" shape="round">
        <nb-icon icon="close"></nb-icon>
      </button>
    </nb-card-header>
    <nb-card-body>
      <p>Are you sure you want to cancel this slot?</p>
    </nb-card-body>
    <nb-card-footer>
      <button nbButton status="danger" (click)="ref.close(true)">Yes, Cancel</button>
      <button nbButton (click)="ref.close(false)">No</button>
    </nb-card-footer>
  </nb-card>
</ng-template>
