<div class="slots-grid">
  <div *ngFor="let slot of round.round_mentor_slot_rule.slot_times; let i = index" class="slot-item">
    @if (roundMentorSlots) {
    <commudle-mentor-slot-team-assignment
      [round]="round"
      [mentor]="mentor"
      [index]="i"
      [roundMentorSlots]="roundMentorSlots"
      (slotClick)="onSlotClick($event, i)"
    ></commudle-mentor-slot-team-assignment>
    }
  </div>
</div>
