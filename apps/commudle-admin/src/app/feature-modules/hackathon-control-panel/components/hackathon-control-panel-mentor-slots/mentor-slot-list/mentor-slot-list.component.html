<div class="slots-grid">
  <div *ngFor="let slot of [].constructor(round.round_mentor_slot_rule.total_slots); let i = index" class="slot-item">
    @if (roundMentorSlots) {
    <commudle-mentor-slot-team-assignment
      [round]="round"
      [mentor]="mentor"
      [index]="i"
      [roundMentorSlots]="roundMentorSlots"
      (slotClick)="onSlotClick($event, i)"
    ></commudle-mentor-slot-team-assignment>
    }
  </div>
</div>
