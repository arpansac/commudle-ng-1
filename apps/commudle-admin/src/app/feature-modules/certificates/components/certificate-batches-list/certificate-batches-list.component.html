<div class="certificate-batches-list">
  <div class="list-header">
    <h1 class="page-title">Certificates</h1>
    <button nbButton status="primary" size="medium" (click)="openCreateDialog()">
      <fa-icon [icon]="icons.faPlus"></fa-icon> &nbsp; New Batch
    </button>
  </div>

  <app-loading-spinner *ngIf="isLoading"></app-loading-spinner>

  <ng-container *ngIf="!isLoading">
    <nb-card *ngIf="batches.length === 0">
      <nb-card-body class="empty-state"> No certificate batches yet. Create one to get started. </nb-card-body>
    </nb-card>

    <nb-card *ngIf="batches.length > 0">
      <nb-card-body>
        <table class="batches-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Status</th>
              <th>Recipients</th>
              <th>Sent</th>
              <th>Created</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let batch of batches" [routerLink]="[batch.uuid]" class="batch-row">
              <td>{{ batch.name }}</td>
              <td>
                <nb-badge [text]="statusLabel(batch.status)" status="info" position="static"></nb-badge>
              </td>
              <td>{{ batch.recipients_count }}</td>
              <td>{{ batch.sent_count }}</td>
              <td>{{ moment(batch.created_at).format('DD MMM YYYY') }}</td>
            </tr>
          </tbody>
        </table>
      </nb-card-body>
    </nb-card>

    <app-pagination
      *ngIf="total > count"
      [current]="page"
      [count]="count"
      [total]="total"
      (goTo)="onPageChange($event)"
      (next)="onPageChange($event)"
      (previous)="onPageChange($event)"
    ></app-pagination>
  </ng-container>
</div>
