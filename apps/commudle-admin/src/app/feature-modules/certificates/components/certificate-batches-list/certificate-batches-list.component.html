<div class="certificate-batches-list">
  <div class="list-header">
    <h1 class="page-title">Certificates</h1>
    <button comButton status="primary" size="medium" (click)="openCreateDialog()">
      <fa-icon [icon]="icons.faPlus"></fa-icon> &nbsp; New Batch
    </button>
  </div>

  <app-loading-spinner *ngIf="isLoading"></app-loading-spinner>

  <ng-container *ngIf="!isLoading">
    <com-card *ngIf="batches.length === 0">
      <com-card-body class="empty-state"> No certificate batches yet. Create one to get started. </com-card-body>
    </com-card>

    <div class="batches-table" *ngIf="batches.length > 0">
      <commudle-data-table [columns]="tableColumns" [rows]="tableRows" [config]="tableConfig"> </commudle-data-table>
    </div>

    <app-pagination
      *ngIf="total > count"
      [current]="page"
      [count]="count"
      [total]="total"
      (goTo)="onPageChange($event)"
      (next)="onPageChange($event)"
      (previous)="onPageChange($event)"
    ></app-pagination>
  </ng-container>
</div>

<ng-template #nameCell let-row="row">
  <a [routerLink]="[row.uuid]" class="name-link">{{ row.name }}</a>
</ng-template>

<ng-template #statusCell let-row="row">
  <nb-badge [text]="statusLabel(row.status)" status="info" position="static"></nb-badge>
</ng-template>
