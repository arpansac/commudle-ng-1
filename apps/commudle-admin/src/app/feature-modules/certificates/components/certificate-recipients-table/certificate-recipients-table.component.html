<div class="certificate-recipients-table">
  <div class="table-header">
    <button comButton status="basic" size="small" (click)="openCsvUploadDialog()">
      <fa-icon [icon]="icons.faUpload"></fa-icon> &nbsp; Upload CSV
    </button>
    <button comButton status="primary" size="small" (click)="openAddDialog()">
      <fa-icon [icon]="icons.faPlus"></fa-icon> &nbsp; Add Recipient
    </button>
  </div>

  <app-loading-spinner *ngIf="isLoading"></app-loading-spinner>

  <ng-container *ngIf="!isLoading">
    <div *ngIf="recipients.length === 0" class="empty-state">No recipients yet. Add one manually, or upload a CSV.</div>

    <section class="recipient-list-container" *ngIf="recipients.length > 0">
      <div class="table-wrapper">
        <table class="recipients-table">
          <thead>
            <tr class="table-header-row">
              <th>EMAIL</th>
              <th>NAME</th>
              <th *ngFor="let variable of variables">{{ variable.label }}</th>
              <th>STATUS</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let recipient of recipients" class="recipient-row">
              <td>{{ recipient.email }}</td>
              <td>{{ recipient.name || '-' }}</td>
              <td *ngFor="let variable of variables">{{ recipient.row_values?.[variable.key] || '-' }}</td>
              <td>
                <app-badge
                  [text]="statusLabel(recipient.status) | titlecase"
                  [fontSize]="'small'"
                  [borderRadius]="'round'"
                  [color]="statusColor(recipient.status)"
                  [fontColor]="statusFontColor(recipient.status)"
                ></app-badge>
                <div class="skip-reason" *ngIf="recipient.skip_reason">{{ recipient.skip_reason }}</div>
              </td>
              <td class="actions">
                <button
                  *ngIf="canSendIndividually && recipient.sendable"
                  ghost
                  comButton
                  size="tiny"
                  status="success"
                  (click)="sendOne(recipient)"
                >
                  <fa-icon [icon]="icons.faPaperPlane"></fa-icon>
                </button>
                <button ghost comButton size="tiny" (click)="openPreviewDialog(recipient)">
                  <fa-icon [icon]="icons.faEye"></fa-icon>
                </button>
                <button ghost comButton size="tiny" (click)="openEditDialog(recipient)">
                  <fa-icon [icon]="icons.faPen"></fa-icon>
                </button>
                <button ghost comButton size="tiny" status="danger" (click)="deleteRecipient(recipient)">
                  <fa-icon [icon]="icons.faTrash"></fa-icon>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <app-pagination
        class="pagination"
        *ngIf="total > count"
        [current]="page"
        [count]="count"
        [total]="total"
        (goTo)="onPageChange($event)"
        (next)="onPageChange($event)"
        (previous)="onPageChange($event)"
      ></app-pagination>
    </section>
  </ng-container>
</div>
