<div class="certificate-variables-panel">
  <app-loading-spinner *ngIf="isLoading"></app-loading-spinner>

  <ng-container *ngIf="!isLoading">
    <div *ngIf="variables.length === 0" class="empty-state">
      No variables yet. They're created automatically from a CSV upload, or add one manually below.
    </div>

    <div class="variables-table" *ngIf="variables.length > 0">
      <commudle-data-table [columns]="tableColumns" [rows]="tableRows" [config]="tableConfig"> </commudle-data-table>
    </div>

    <button comButton status="basic" size="small" (click)="toggleAddForm()">
      <fa-icon [icon]="icons.faPlus"></fa-icon> &nbsp; {{ showAddForm ? 'Cancel' : 'Add Variable' }}
    </button>

    <form *ngIf="showAddForm" [formGroup]="addForm" (ngSubmit)="addVariable()" class="add-variable-form">
      <input formControlName="label" nbInput fieldSize="small" placeholder="Variable label" />
      <input formControlName="default_value" nbInput fieldSize="small" placeholder="Default value (optional)" />
      <button type="submit" comButton status="primary" size="small" [disabled]="addForm.invalid">Add</button>
    </form>
  </ng-container>
</div>

<ng-template #labelCell let-row="row">
  <input
    class="cell-input"
    nbInput
    fieldSize="small"
    [value]="row.variable.label"
    (blur)="saveLabel(row.variable, $any($event.target).value)"
  />
</ng-template>

<ng-template #defaultValueCell let-row="row">
  <input
    class="cell-input"
    nbInput
    fieldSize="small"
    [value]="row.variable.default_value"
    placeholder="No default - blocks a row missing this value"
    (blur)="saveDefaultValue(row.variable, $any($event.target).value)"
  />
</ng-template>

<ng-template #keepCell let-row="row">
  <nb-checkbox [checked]="row.variable.keep" (checkedChange)="toggleKeep(row.variable, $event)"></nb-checkbox>
</ng-template>

<ng-template #deleteCell let-row="row">
  <button ghost comButton size="tiny" status="danger" (click)="deleteVariable(row.variable)">
    <fa-icon [icon]="icons.faTrash"></fa-icon>
  </button>
</ng-template>
