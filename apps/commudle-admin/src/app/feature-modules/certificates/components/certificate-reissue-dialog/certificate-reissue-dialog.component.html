<com-card class="certificate-reissue-dialog">
  <com-card-header class="dialog-header">
    <span>Apply the new design</span>
    <button ghost comButton size="small" (click)="close()" shape="round">
      <nb-icon icon="close"></nb-icon>
    </button>
  </com-card-header>
  <com-card-body>
    <p class="dialog-hint">
      Some recipients may already have a certificate issued under the previous design. Issued certificates are never
      changed automatically - choose who should get the new one.
    </p>

    <button type="button" class="reissue-option" (click)="choose('unissued')">
      <span class="option-title">Only recipients not yet issued</span>
      <span class="option-description">Anyone already issued a certificate keeps their existing one as-is.</span>
    </button>

    <button type="button" class="reissue-option" (click)="choose('all')">
      <span class="option-title">All recipients</span>
      <span class="option-description">Re-issues everyone under the new design, including anyone already issued.</span>
    </button>

    <button type="button" class="reissue-option" (click)="choose('specific')">
      <span class="option-title">Choose specific recipients</span>
      <span class="option-description">Select recipients yourself in the table below, then resend to just them.</span>
    </button>
  </com-card-body>
  <com-card-footer>
    <button comButton status="basic" fullWidth (click)="close()">Not now</button>
  </com-card-footer>
</com-card>
