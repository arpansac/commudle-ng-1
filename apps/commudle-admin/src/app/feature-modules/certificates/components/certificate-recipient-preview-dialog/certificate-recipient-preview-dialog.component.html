<com-card class="certificate-recipient-preview-dialog">
  <com-card-header class="dialog-header">
    <span>Preview - {{ recipient.email }}</span>
    <button ghost comButton size="small" (click)="close()" shape="round">
      <nb-icon icon="close"></nb-icon>
    </button>
  </com-card-header>
  <com-card-body>
    <app-loading-spinner *ngIf="isLoading"></app-loading-spinner>

    <commudle-alert *ngIf="errorMessage" [error]="true" [errorMessage]="errorMessage"></commudle-alert>

    <object
      *ngIf="pdfObjectUrl"
      [attr.data]="pdfObjectUrl | safe : 'resourceUrl'"
      type="application/pdf"
      class="pdf-object"
    ></object>
  </com-card-body>
</com-card>
