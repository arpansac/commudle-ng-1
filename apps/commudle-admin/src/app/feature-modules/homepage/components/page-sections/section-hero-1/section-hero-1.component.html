<div class="com-bg-white com-py-12">
  <div class="base-layout container">
    <h1 class="com-text-Page-Heading com-text-Yankees-Blue">
      {{ config.title }}
    </h1>

    <p class="com-text-Paragraph-1 com-text-Auro-Metal-Saurus com-mt-4">
      {{ config.subtitle }}
    </p>

    <button *ngIf="config.ctaText" nbButton status="primary" class="com-mt-6">
      {{ config.ctaText }}
    </button>
  </div>
</div>
