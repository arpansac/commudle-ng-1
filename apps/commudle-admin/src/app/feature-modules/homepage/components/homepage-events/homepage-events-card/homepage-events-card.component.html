<a
  *ngIf="community && event"
  [routerLink]="['/communities', community.slug, 'events', event.slug]"
  class="home-events-card-container"
>
  <div>
    <div [ngClass]="{ old: moment(event.start_time) < moment() }" class="home-events-card-image-overlay"></div>
    <commudle-banner-image
      [headerImagePath]="event.header_image?.i350 || community.logo_image_path.i320"
      [name]="event.name"
      [aspectRatio]="'16/9'"
    ></commudle-banner-image>
  </div>
  <div
    *ngIf="event.start_time"
    [ngClass]="{ old: moment(event.start_time) < moment() && moment(event.end_time) < moment() }"
    class="home-events-card-date"
  >
    {{ moment(event.start_time).format('MMM DD') }}
  </div>
  <div class="com-aspect-w-16 com-aspect-h-9">
    <div class="home-events-card-details">
      <div>
        <h3 class="home-events-card-name">{{ event.name }}</h3>
        <div
          class="start-end-date"
          *ngIf="moment(event.start_time).format('DD MMM') !== moment(event.end_time).format('DD MMM')"
        >
          {{ moment(event.start_time).format('DD MMM') }} - {{ moment(event.end_time).format('DD MMM') }}
        </div>
      </div>
      <div class="home-events-card-host d-flex justify-content-space-between align-items-center">
        <div class="home-events-card-community d-flex align-items-center">
          <img
            alt="{{ community.name }}"
            class="home-events-card-community-logo"
            src="{{ community.logo_image_path.i64 }}"
            title="{{ community.name }}"
          />
          <p class="home-events-card-community-name">{{ community.name }}</p>
        </div>
        <div *ngIf="event.start_time && moment(event.start_time) > moment()" class="home-events-card-register">
          Register
        </div>
      </div>
    </div>
  </div>
</a>
