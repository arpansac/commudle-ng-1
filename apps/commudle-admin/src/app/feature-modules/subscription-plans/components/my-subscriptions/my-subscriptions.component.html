<div class="my-subscriptions-page">
  <div class="base-layout">
    <div class="container">
      <div class="dashboard-layout">
        <!-- ── Left sidebar ── -->
        <aside class="dashboard-sidebar">
          <div class="sidebar-title">
            <h1 class="page-title">My Subscriptions</h1>
            <p class="page-subtitle">Manage your plans and communities.</p>
          </div>

          <!-- Nav -->
          <nav class="sidebar-nav">
            <a
              *ngFor="let tab of tabs"
              [routerLink]="tab.route"
              routerLinkActive="nav-active"
              [routerLinkActiveOptions]="{ exact: tab.exact }"
              class="nav-item"
            >
              {{ tab.title }}
            </a>
          </nav>

          <!-- Stats -->
          <div class="sidebar-stats">
            <div class="stat-item">
              <span class="stat-value">{{ activeCount }}</span>
              <span class="stat-label">Active Plans</span>
            </div>
            <div class="stat-item">
              <span class="stat-value">{{ totalCommunities }}</span>
              <span class="stat-label">Communities</span>
            </div>
            <div class="stat-item">
              <span class="stat-value">{{ totalOrganizations }}</span>
              <span class="stat-label">Organizations</span>
            </div>
          </div>
        </aside>

        <!-- ── Main content ── -->
        <main class="dashboard-main">
          <router-outlet></router-outlet>
        </main>
      </div>
    </div>
  </div>
</div>
