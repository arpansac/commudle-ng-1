<div class="blog-container">
  <div class="base-layout">
    <div class="container">
      <div class="two-column-layout medium">
        <div class="main-column">
          <app-loading-spinner *ngIf="isLoading"></app-loading-spinner>
          <div *ngIf="blog" class="blog">
            <div class="header">
              <div class="date-reading-time">
                <p class="date">
                  <fa-icon [icon]="faCalendar"></fa-icon><span>{{ blog.publishedAt | date }}</span>
                </p>
                <p class="reading-time"><fa-icon [icon]="faClock"></fa-icon></p>
              </div>
              <h1 class="blog-title">{{ blog.title }}</h1>
            </div>
            <div>
              <div class="user-profile-large">
                <app-user-profile-card-large *ngIf="user" [user]="user"></app-user-profile-card-large>
                <div class="action-buttons">
                  <app-share-button
                    [content]="environment.app_url + '/blogs/' + blog.slug.current"
                    [title]="blog.title"
                    [text]="blog.title"
                    [url]="environment.app_url + '/blogs/' + blog.slug.current"
                    [showText]="true"
                    [round]="false"
                  ></app-share-button>
                  <a
                    [href]="
                      'https://json.commudle.com/api/v2/sanity/blogs/rss/blog_feed.rss?blog_slug=' + blog.slug.current
                    "
                    target="_blank"
                    class="rss-button"
                    ><fa-icon [icon]="faRssSquare"></fa-icon
                  ></a>
                </div>
              </div>
              <div class="image-content">
                <div class="image">
                  <app-loading-spinner *ngIf="imageLoading"></app-loading-spinner>
                  <img [alt]="blog.title" [src]="imageUrl(blog.headerImage).url()" />
                </div>
                <article>
                  <div [innerHTML]="richText" class="!com-max-w-full content"></div>
                </article>
              </div>
              <!-- <app-share-button
                [content]="environment.app_url + '/blogs/' + blog.slug.current"
                [title]="blog.title"
                [text]="blog.title"
                [url]="environment.app_url + '/blogs/' + blog.slug.current"
                [showText]="true"
                [round]="false"
              ></app-share-button> -->
            </div>
          </div>
        </div>

        <div class="right-column">
          <nb-card class="latest-blog">
            <h1 class="heading">Latest Blogs</h1>
            <!-- *ngFor="let latestBlog of latestBlogs" -->
            <div class="latest-blog-cards">
              <nb-card *ngFor="let blog of blogs" class="latest-blog-card">
                <nb-card-body class="blog-card">
                  <h2 class="latest-blog-title">{{ blog.title }}</h2>
                  <p class="published-on">
                    Published on <span>{{ blog.publishedAt | date }}</span>
                  </p>
                </nb-card-body>
              </nb-card>
            </div>
          </nb-card>
        </div>
      </div>
      <!-- blogFAQ's section -->
      <nb-card *ngIf="blog?.faq">
        <nb-card-body>
          <h2>FAQ's</h2>
          <div>
            <ul style="list-style-type: none; padding-left: 0" *ngFor="let item of blog?.faq">
              <li>
                <div class="com-text-xl com-font-bold com-pb-3">{{ item?.question }}</div>
                <div>{{ item?.answer }}</div>
              </li>
            </ul>
          </div>
        </nb-card-body>
      </nb-card>

      <!-- similarBlogs Section -->
      <div *ngIf="blog?.similarBlogs" class="similar-blogs">
        <h2 class="similar-blogs-heading">More from the Journal</h2>
        <commudle-blog-card [blogs]="similarBlogs" [shareButton]="false"></commudle-blog-card>
      </div>

      <a [routerLink]="['/blogs']" ghost status="primary" nbButton size="small" class="back-btn">
        <nb-icon icon="arrow-ios-back"></nb-icon>
        Back to list of blogs
      </a>
    </div>
  </div>
</div>
