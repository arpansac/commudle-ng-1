<div class="category-heading">STATUS</div>
<section *ngIf="event.editable">
  <!-- <nb-button-group
    (valueChange)="openConfirmationPopup($event[0])"
    [size]="isMobileView ? 'medium' : 'small'"
    filled
    class="border"
  >
    <button
      *ngFor="let i of eventStatuses"
      [pressed]="event.event_status.name === i"
      [value]="i"
      nbButtonToggle
      class="md:!com-px-3"
    >
      {{ i | titlecase }}
    </button>
  </nb-button-group> -->
  <div class="filter">
    <select class="select-status" (change)="openConfirmationPopup($any($event.target).value)">
      <option *ngFor="let i of eventStatuses" [value]="i" [selected]="event.event_status.name === i">
        {{ i | titlecase }}
      </option>
    </select>
  </div>
</section>

<section *ngIf="!event.editable">
  <nb-alert status="success" class="com-mb-0">This event is completed!</nb-alert>
</section>

<ng-template #completeStatusConfirmationPopup let-ref="dialogRef" let-data>
  <nb-card>
    <nb-card-body>
      <div>Are you sure you want to change status to Completed ?</div>
    </nb-card-body>
    <nb-card-footer class="action-buttons">
      <button (click)="ref.close(true)" nbButton status="success">Yes</button>
      <button (click)="ref.close(false)" nbButton status="danger">No</button>
    </nb-card-footer>
  </nb-card>
</ng-template>
