<div class="chats-list-container" [ngClass]="{ 'page-mode': isPersonalChatsPage }">
  <nb-card [ngClass]="{ active: showChat }" class="chats-list">
    <nb-card-header class="d-flex align-items-center justify-content-space-between">
      <div>Personal Inbox</div>
      <button *ngIf="!isPersonalChatsPage" (click)="showChat = !showChat" ghost nbButton shape="round" size="small">
        <nb-icon icon="close"></nb-icon>
      </button>
    </nb-card-header>
    <nb-card-body>
      <nb-list>
        <nb-list-item
          [infiniteScrollDisabled]="allPersonalChatUsers.length >= totalChats"
          [infiniteScrollDistance]="10"
          [infiniteScrollUpDistance]="-8"
          (scrolled)="getMoreChatsList()"
          class="messages-list"
          commudleInfiniteScroll
          (click)="openChat(chatUser)"
          *ngFor="let chatUser of allPersonalChatUsers"
          [ngClass]="{ selectedUser: selectedChatUser === chatUser }"
          class="clickable"
        >
          <div class="user-profile">
            <app-user-profile-mini
              [showLiveStatus]="showLiveStatus"
              [disableAnchor]="true"
              [size]="'small'"
              [user]="chatUser.user"
              [alignStart]="true"
              [profileInfoMaxWidth]="'100%'"
              [addPadding]="false"
              [userLatestMessage]="chatUser.last_message?.content"
              [unreadMessagesCount]="chatUser.unread_messages_count"
            ></app-user-profile-mini>
            <p *ngIf="chatUser.last_message" class="date">
              {{ moment(chatUser.last_message.created_at).format('ll') }}
            </p>
          </div>
        </nb-list-item>
      </nb-list>
      <app-loading-spinner *ngIf="loadingChat"></app-loading-spinner>
    </nb-card-body>
  </nb-card>
  <button (click)="onToggleClick()" class="chats-list-toggle" nbButton shape="round">
    <nb-badge *ngIf="unreadCount > 0" status="info" text="{{ unreadCount }}"></nb-badge>
    <nb-icon icon="message-square-outline"></nb-icon>
  </button>
</div>
