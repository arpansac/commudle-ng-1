<div class="create-community-form">
  <div class="form-header">
    <div class="header-top">
      <h4 class="form-title">Create New Community</h4>
      <button nbButton ghost size="small" shape="round" (click)="close()">
        <nb-icon icon="close"></nb-icon>
      </button>
    </div>
    <p class="form-subtitle">Fill in the details below to set up your community.</p>
  </div>

  <div class="form-body">
    <form [formGroup]="communityForm" (ngSubmit)="createCommunity()" class="community-create-form">
      <!-- ── Basic Info ── -->
      <div class="section-heading">Basic Info</div>

      <div role="group">
        <div>
          <label>
            Name *
            <input nbInput fullWidth formControlName="name" type="text" placeholder="e.g. GDG New Delhi" />
          </label>
          <span *ngIf="communityForm.get('name').touched && communityForm.get('name').hasError('required')">
            <commudle-alert [error]="true" errorMessage="Name is required."></commudle-alert>
          </span>
          <span *ngIf="communityForm.get('name').touched && communityForm.get('name').hasError('minlength')">
            <commudle-alert [error]="true" errorMessage="Name must be at least 3 characters."></commudle-alert>
          </span>
        </div>
      </div>

      <!-- Slug -->
      <div role="group">
        <div>
          <label>
            Community URL Slug *
            <div class="slug-wrap">
              <span class="slug-prefix">commudle.com/communities/</span>
              <input
                nbInput
                fullWidth
                formControlName="slug"
                type="text"
                placeholder="gdg-new-delhi"
                class="slug-field"
                (input)="onSlugInput()"
              />
              <span class="slug-status-icon">
                <fa-icon *ngIf="slugCheckState === 'checking'" [icon]="icons.faSpinner" class="slug-checking"></fa-icon>
                <fa-icon
                  *ngIf="slugCheckState === 'available'"
                  [icon]="icons.faCheckCircle"
                  class="slug-available"
                ></fa-icon>
                <fa-icon *ngIf="slugCheckState === 'taken'" [icon]="icons.faTimesCircle" class="slug-taken"></fa-icon>
              </span>
            </div>
          </label>
          <span *ngIf="communityForm.get('slug').touched && communityForm.get('slug').hasError('required')">
            <commudle-alert [error]="true" errorMessage="Slug is required."></commudle-alert>
          </span>
          <span *ngIf="communityForm.get('slug').touched && communityForm.get('slug').hasError('pattern')">
            <commudle-alert
              [error]="true"
              errorMessage="Only lowercase letters, numbers and hyphens allowed."
            ></commudle-alert>
          </span>
          <span *ngIf="slugCheckState === 'taken'">
            <commudle-alert
              [error]="true"
              errorMessage="This slug is already taken. Please choose another."
            ></commudle-alert>
          </span>
          <div class="slug-info-box">
            <fa-icon [icon]="icons.faCircleInfo"></fa-icon>
            <span
              >The slug forms your community's permanent URL and <strong>cannot be changed</strong> after
              creation.</span
            >
          </div>
        </div>
      </div>

      <div role="group">
        <div>
          <label>
            Contact Email *
            <input nbInput fullWidth formControlName="contact_email" type="email" placeholder="hello@community.com" />
          </label>
          <span
            *ngIf="
              communityForm.get('contact_email').touched && communityForm.get('contact_email').hasError('required')
            "
          >
            <commudle-alert [error]="true" errorMessage="Email is required."></commudle-alert>
          </span>
          <span
            *ngIf="communityForm.get('contact_email').touched && communityForm.get('contact_email').hasError('email')"
          >
            <commudle-alert [error]="true" errorMessage="Please enter a valid email."></commudle-alert>
          </span>
        </div>
      </div>

      <div role="group">
        <div>
          <label>
            Mini Description *
            <input
              nbInput
              fullWidth
              formControlName="mini_description"
              type="text"
              placeholder="A short one-liner about your community"
            />
          </label>
          <span
            *ngIf="
              communityForm.get('mini_description').touched &&
              communityForm.get('mini_description').hasError('required')
            "
          >
            <commudle-alert [error]="true" errorMessage="Mini description is required."></commudle-alert>
          </span>
        </div>
      </div>

      <div role="group">
        <div>
          <label>
            Location
            <input nbInput fullWidth formControlName="location" type="text" placeholder="e.g. New Delhi, India" />
          </label>
        </div>
      </div>

      <div role="group">
        <div>
          <label>
            Website
            <input nbInput fullWidth formControlName="website" type="url" placeholder="https://yourcommunity.com" />
          </label>
        </div>
      </div>

      <!-- About (TinyMCE) -->
      <div class="about" role="group">
        <label>
          About
          <editor [init]="tinyMCE" formControlName="about"></editor>
        </label>
      </div>

      <!-- ── Images ── -->
      <div class="section-heading">Images</div>

      <!-- Logo -->
      <div role="group">
        <div>
          <label>Logo <small>(PNG, JPG · max 5MB)</small></label>
          <label *ngIf="!logoPreview" class="upload-area" (click)="logoInput.click()">
            <fa-icon [icon]="icons.faImage" class="upload-icon"></fa-icon>
            <span>Click to upload logo</span>
            <input
              #logoInput
              type="file"
              accept="image/png,image/jpg,image/jpeg"
              class="hidden-input"
              (change)="onLogoSelected($event)"
            />
          </label>
          <div *ngIf="logoPreview" class="image-preview-block">
            <img [src]="logoPreview" alt="Logo preview" class="logo-preview" />
            <button nbButton status="danger" outline size="tiny" type="button" (click)="removeLogo()">
              <nb-icon icon="trash-2-outline"></nb-icon> Remove
            </button>
          </div>
        </div>
      </div>

      <!-- Banner -->
      <div role="group">
        <div>
          <label>Banner Image <small>(PNG, JPG · max 5MB · 1280×320px)</small></label>
          <label *ngIf="!bannerPreview" class="upload-area upload-area-banner" (click)="bannerInput.click()">
            <fa-icon [icon]="icons.faUpload" class="upload-icon"></fa-icon>
            <span>Click to upload banner</span>
            <small>(1280px × 320px)</small>
            <input
              #bannerInput
              type="file"
              accept="image/png,image/jpg,image/jpeg"
              class="hidden-input"
              (change)="onBannerSelected($event)"
            />
          </label>
          <div *ngIf="bannerPreview" class="image-preview-block">
            <div class="com-flex com-justify-center com-mb-2">
              <button nbButton status="danger" outline size="tiny" type="button" (click)="removeBanner()">
                <nb-icon icon="trash-2-outline"></nb-icon> Remove
              </button>
            </div>
            <img [src]="bannerPreview" alt="Banner preview" class="banner-preview" />
          </div>
        </div>
      </div>

      <!-- ── Social Links ── -->
      <div class="section-heading">Social Links</div>

      <div role="group">
        <div>
          <label>
            <fa-icon [icon]="icons.faFacebook" class="social-icon social-facebook"></fa-icon> Facebook
            <input nbInput fullWidth formControlName="facebook" type="url" placeholder="https://facebook.com/..." />
          </label>
        </div>
        <div>
          <label>
            <fa-icon [icon]="icons.faTwitter" class="social-icon social-twitter"></fa-icon> Twitter / X
            <input nbInput fullWidth formControlName="twitter" type="url" placeholder="https://twitter.com/..." />
          </label>
        </div>
      </div>

      <div role="group">
        <div>
          <label>
            <fa-icon [icon]="icons.faGithub" class="social-icon"></fa-icon> GitHub
            <input nbInput fullWidth formControlName="github" type="url" placeholder="https://github.com/..." />
          </label>
        </div>
        <div>
          <label>
            <fa-icon [icon]="icons.faLinkedin" class="social-icon social-linkedin"></fa-icon> LinkedIn
            <input nbInput fullWidth formControlName="linkedin" type="url" placeholder="https://linkedin.com/..." />
          </label>
        </div>
      </div>

      <div role="group">
        <div>
          <label>
            <fa-icon [icon]="icons.faInstagram" class="social-icon social-instagram"></fa-icon> Instagram
            <input nbInput fullWidth formControlName="instagram" type="url" placeholder="https://instagram.com/..." />
          </label>
        </div>
      </div>
    </form>
  </div>

  <div class="form-footer">
    <button nbButton ghost (click)="close()" [disabled]="isSubmitting" type="button">Cancel</button>
    <button
      nbButton
      status="primary"
      type="button"
      [disabled]="communityForm.invalid || isSubmitting || slugCheckState === 'taken' || slugCheckState === 'checking'"
      (click)="createCommunity()"
    >
      <nb-icon *ngIf="isSubmitting" icon="loader-outline" class="spinning"></nb-icon>
      {{ isSubmitting ? 'Creating...' : 'Create Community' }}
    </button>
  </div>
</div>
