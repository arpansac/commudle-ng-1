<div *ngIf="user" class="profile-qr-card">
  <div class="card-rings">
    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>
    <div class="ring ring-3"></div>
  </div>
  <div class="card-glass">
    <commudle-user-profile [currentUser]="user" [addBackgroundColor]="false"></commudle-user-profile>

    <div class="divider"></div>

    <div class="qr-section">
      <div class="qr-wrapper">
        <canvas #qrCanvas class="qr-canvas"></canvas>
      </div>
      <p class="scan-text">Scan to connect</p>
    </div>
  </div>
</div>
