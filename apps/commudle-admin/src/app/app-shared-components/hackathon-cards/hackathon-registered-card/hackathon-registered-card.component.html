<div class="hackathon-details" *ngIf="hackathon">
  <div class="date-registered-text">
    <div *ngIf="hackathon.start_date" class="hackathon-start-date">
      <fa-icon [icon]="icons.faCalendarDays"></fa-icon>&nbsp;
      <span>{{ moment(hackathon.start_date).format('MMM DD, YYYY') }}</span>
    </div>
    <div class="registered-text" *ngIf="showRegisteredIcon">
      <fa-icon [icon]="icons.faCircleCheck"></fa-icon>&nbsp;You're Registered
    </div>
  </div>

  <div class="hackathon-location-prize-money-container">
    <div class="hackathon-location" *ngIf="hackathon?.location_name">
      <fa-icon [icon]="icons.faLocationDot"></fa-icon>&nbsp;
      <a [href]="hackathon.location_map_link">{{ hackathon.location_name }}</a>
    </div>
    <div *ngIf="totalPrizesByCurrency?.length > 0" class="prize-money">
      <fa-icon [icon]="icons.faSackDollar"></fa-icon>
      <span>{{ totalPrizesByCurrency[0].currency.symbol }}{{ totalPrizesByCurrency[0].amount }}</span>
    </div>
  </div>

  <div class="interested-members">
    <commudle-interested-members
      [users]="interestedUsers"
      [totalCount]="interestedUsersCount"
      [showHeading]="false"
    ></commudle-interested-members>
  </div>

  <div class="actions">
    <div class="primary-buttons">
      <button
        *ngIf="showAddToCalendarButton"
        nbButton
        status="primary"
        fullWidth
        shape="semi-round"
        (click)="addToCalendar()"
      >
        <fa-icon [icon]="icons.faCalendarPlus"></fa-icon>&nbsp; Add to Calendar
      </button>
      <button status="info" nbButton outline fullWidth shape="semi-round" (click)="shareHackathon()">
        <fa-icon [icon]="icons.faShareNodes"></fa-icon>&nbsp; Share Hackathon
      </button>
    </div>
    <div class="secondary-button">
      <a
        [routerLink]="[
          '/communities',
          hackathon.community ? hackathon.community.id : community.id,
          'hackathons',
          this.hackathon.slug
        ]"
      >
        <button nbButton fullWidth shape="semi-round" outline class="take-hackathon-button">
          <fa-icon [icon]="icons.faArrowUpRightFromSquare"></fa-icon>&nbsp; Take me to Hackathon's Page
        </button>
      </a>
    </div>
  </div>
</div>
