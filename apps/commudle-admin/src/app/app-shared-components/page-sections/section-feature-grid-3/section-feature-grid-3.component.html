<div [attr.id]="config.fragmentId || null" class="com-bg-white com-py-12 md:com-py-16 com-overflow-x-hidden">
  <div class="base-layout container com-px-4 md:com-px-6">
    <div *ngIf="config.eyebrow || config.heading || config.subtext" class="section-header com-mb-10">
      <p *ngIf="config.eyebrow" class="section-header__eyebrow">{{ config.eyebrow }}</p>
      <h2
        *ngIf="config.heading"
        class="section-header__heading"
        [ngClass]="{ 'section-heading-anchor': config.fragmentId }"
      >
        {{ config.heading }}
        <a
          *ngIf="config.fragmentId"
          [routerLink]="'.'"
          [fragment]="config.fragmentId"
          class="anchor-link"
          [attr.aria-label]="'Link to ' + config.heading + ' section'"
        >
          <fa-icon [icon]="faHashtag" class="anchor-icon-medium"></fa-icon>
        </a>
      </h2>
      <p *ngIf="config.subtext" class="section-header__sub">{{ config.subtext }}</p>
    </div>

    <div class="cards com-grid com-grid-cols-1 sm:com-grid-cols-2 lg:com-grid-cols-4 com-gap-6">
      <div *ngFor="let item of config.items" class="card com-rounded-10">
        <span class="card__pattern" aria-hidden="true"></span>

        <div *ngIf="item.image" class="card__media">
          <img [src]="item.image.url" [alt]="item.image.alt" loading="lazy" />
        </div>

        <div class="card__body">
          <span class="card__icon" aria-hidden="true"><fa-icon [icon]="iconFor(item.icon)"></fa-icon></span>
          <h3 class="card__title com-text-Card-Subheading com-text-tWhite com-mt-4 com-mb-2">{{ item.title }}</h3>
          <p class="card__desc com-text-Paragraph-2 com-m-0">{{ item.description }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
