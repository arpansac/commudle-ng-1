<div [attr.id]="config.fragmentId || null" class="cta-section com-bg-Seashell com-py-14 md:com-py-20 com-overflow-x-hidden">
  <!-- Purely decorative — soft colour blobs + a big watermark rocket, so the section doesn't read as bare/floating text on a flat surface. -->
  <div class="cta-decor" aria-hidden="true">
    <span class="cta-decor__blob cta-decor__blob--a"></span>
    <span class="cta-decor__blob cta-decor__blob--b"></span>
    <fa-icon [icon]="faRocket" class="cta-decor__rocket"></fa-icon>
  </div>

  <div class="base-layout container com-px-4 md:com-px-6">
    <div class="cta-inner com-flex com-flex-col com-items-center com-text-center">
      <h2
        class="com-text-Page-Section-Header com-font-medium com-text-tYankees-Blue com-m-0 com-mb-3"
        [ngClass]="{ 'section-heading-anchor': config.fragmentId }"
      >
        {{ config.heading }}
        <a
          *ngIf="config.fragmentId"
          [routerLink]="'.'"
          [fragment]="config.fragmentId"
          class="anchor-link"
          [attr.aria-label]="'Link to ' + config.heading + ' section'"
        >
          <fa-icon [icon]="faHashtag" class="anchor-icon-medium"></fa-icon>
        </a>
      </h2>
      <p *ngIf="config.subtext" class="com-text-Paragraph-1 com-text-tAuro-Metal-Saurus com-m-0 com-max-w-xl">
        {{ config.subtext }}
      </p>

      <div class="cta-buttons com-mt-6">
        <a
          *ngIf="config.primaryCta.routerLink; else primaryButton"
          [routerLink]="config.primaryCta.routerLink"
          [queryParams]="config.primaryCta.queryParams || null"
        >
          <button nbButton status="primary" size="large" shape="semi-round">{{ config.primaryCta.label }}</button>
        </a>
        <ng-template #primaryButton>
          <button nbButton status="primary" size="large" shape="semi-round" type="button" (click)="onPrimaryClick()">
            {{ config.primaryCta.label }}
          </button>
        </ng-template>

        <a
          *ngIf="config.secondaryCta"
          [routerLink]="config.secondaryCta.routerLink"
          [queryParams]="config.secondaryCta.queryParams || null"
        >
          <button nbButton status="basic" outline size="large" shape="semi-round">
            {{ config.secondaryCta.label }}
          </button>
        </a>
      </div>
    </div>
  </div>
</div>
