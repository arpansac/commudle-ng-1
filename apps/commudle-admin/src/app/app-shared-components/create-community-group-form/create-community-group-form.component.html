<com-card class="create-community-group-form">
  <com-card-header>
    <div class="cf-header">
      <div>
        <h4 class="cf-title">Create New Organization</h4>
        <p class="cf-subtitle">An organization can have multiple community chapters under it.</p>
      </div>
      <button nbButton ghost size="small" shape="round" (click)="close()">
        <nb-icon icon="close"></nb-icon>
      </button>
    </div>
  </com-card-header>

  <com-card-body>
    <form [formGroup]="communityGroupForm" (ngSubmit)="createCommunityGroup()" class="cf-form">
      <!-- ── Basic Info ── -->
      <p class="cf-section-label">Basic Info</p>

      <div class="cf-row">
        <div class="cf-field">
          <label class="cf-label">Organization Name <span class="cf-required">*</span></label>
          <input nbInput fullWidth formControlName="name" type="text" placeholder="e.g. Google Developer Groups" />
          <span *ngIf="communityGroupForm.get('name').touched && communityGroupForm.get('name').hasError('required')">
            <commudle-alert [error]="true" errorMessage="Name is required."></commudle-alert>
          </span>
          <span *ngIf="communityGroupForm.get('name').touched && communityGroupForm.get('name').hasError('minlength')">
            <commudle-alert [error]="true" errorMessage="Minimum 3 characters required."></commudle-alert>
          </span>
        </div>
        <div class="cf-field">
          <label class="cf-label">Contact Email <span class="cf-required">*</span></label>
          <input nbInput fullWidth formControlName="contact_email" type="email" placeholder="hello@organization.com" />
          <span
            *ngIf="
              communityGroupForm.get('contact_email').touched &&
              communityGroupForm.get('contact_email').hasError('required')
            "
          >
            <commudle-alert [error]="true" errorMessage="Email is required."></commudle-alert>
          </span>
          <span
            *ngIf="
              communityGroupForm.get('contact_email').touched &&
              communityGroupForm.get('contact_email').hasError('email')
            "
          >
            <commudle-alert [error]="true" errorMessage="Enter a valid email address."></commudle-alert>
          </span>
        </div>
      </div>

      <div class="cf-row">
        <div class="cf-field cf-field-full">
          <label class="cf-label">URL Slug <span class="cf-required">*</span></label>
          <div class="cf-slug">
            <span class="cf-slug-prefix">commudle.com/orgs/</span>
            <input
              nbInput
              formControlName="slug"
              type="text"
              placeholder="gdg"
              class="cf-slug-input"
              (input)="onSlugInput()"
            />
            <span class="cf-slug-status">
              <fa-icon
                *ngIf="slugCheckState === 'checking'"
                [icon]="icons.faSpinner"
                class="cf-slug-checking"
              ></fa-icon>
              <fa-icon
                *ngIf="slugCheckState === 'available'"
                [icon]="icons.faCheckCircle"
                class="cf-slug-available"
              ></fa-icon>
              <fa-icon *ngIf="slugCheckState === 'taken'" [icon]="icons.faTimesCircle" class="cf-slug-taken"></fa-icon>
            </span>
          </div>
          <span *ngIf="communityGroupForm.get('slug').touched && communityGroupForm.get('slug').hasError('required')">
            <commudle-alert [error]="true" errorMessage="Slug is required."></commudle-alert>
          </span>
          <span *ngIf="communityGroupForm.get('slug').touched && communityGroupForm.get('slug').hasError('pattern')">
            <commudle-alert [error]="true" errorMessage="Lowercase letters, numbers and hyphens only."></commudle-alert>
          </span>
          <span *ngIf="slugCheckState === 'taken'">
            <commudle-alert [error]="true" errorMessage="This slug is already taken."></commudle-alert>
          </span>
          <commudle-alert [info]="true" message="Permanent — cannot be changed after creation."></commudle-alert>
        </div>
      </div>

      <div class="cf-row">
        <div class="cf-field">
          <label class="cf-label">Tagline <span class="cf-required">*</span></label>
          <input
            nbInput
            fullWidth
            formControlName="mini_description"
            type="text"
            placeholder="A short one-liner about your organization"
          />
          <span
            *ngIf="
              communityGroupForm.get('mini_description').touched &&
              communityGroupForm.get('mini_description').hasError('required')
            "
          >
            <commudle-alert [error]="true" errorMessage="Tagline is required."></commudle-alert>
          </span>
        </div>
        <div class="cf-field">
          <label class="cf-label">Website</label>
          <input nbInput fullWidth formControlName="website" type="url" placeholder="https://yourorg.com" />
        </div>
      </div>

      <div class="cf-field cf-field-full">
        <label class="cf-label">About</label>
        <editor [init]="tinyMCE" formControlName="description"></editor>
      </div>

      <!-- ── Logo & Theme ── -->
      <p class="cf-section-label">Logo & Theme</p>

      <div class="cf-row">
        <div class="cf-field">
          <label class="cf-label">Theme Color</label>
          <div class="cf-color-row">
            <input type="color" [value]="themeColor" (input)="onThemeColorChange($event)" class="cf-color-input" />
            <span class="cf-color-value">{{ themeColor }}</span>
          </div>
          <span class="cf-hint-text">Used as your organization's accent color.</span>
        </div>
        <div class="cf-field">
          <label class="cf-label">Logo <span class="cf-hint">(PNG, JPG · max 5MB)</span></label>
          <div class="cf-logo-canvas" [style.background-color]="themeColor">
            <ng-container *ngIf="!logoPreview">
              <label class="cf-logo-trigger" (click)="logoInput.click()">
                <nb-icon icon="image-outline" class="cf-logo-upload-icon"></nb-icon>
                <span>Upload logo</span>
                <input
                  #logoInput
                  type="file"
                  accept="image/png,image/jpg,image/jpeg"
                  class="cf-hidden"
                  (change)="onLogoSelected($event)"
                />
              </label>
            </ng-container>
            <ng-container *ngIf="logoPreview">
              <img [src]="logoPreview" alt="Logo preview" class="cf-logo-img" />
              <button
                nbButton
                status="danger"
                outline
                size="tiny"
                type="button"
                class="cf-logo-remove"
                (click)="removeLogo()"
              >
                <nb-icon icon="trash-2-outline"></nb-icon>
              </button>
            </ng-container>
          </div>
          <span class="cf-hint-text">Preview of logo on your theme color.</span>
        </div>
      </div>

      <!-- ── Social Links ── -->
      <p class="cf-section-label">Social Links</p>

      <div class="cf-row">
        <div class="cf-field">
          <label class="cf-label cf-social-label">
            <fa-icon [icon]="icons.faFacebook" class="cf-social-icon cf-facebook"></fa-icon> Facebook
          </label>
          <input nbInput fullWidth formControlName="facebook" type="url" placeholder="https://facebook.com/..." />
        </div>
        <div class="cf-field">
          <label class="cf-label cf-social-label">
            <fa-icon [icon]="icons.faTwitter" class="cf-social-icon cf-twitter"></fa-icon> Twitter / X
          </label>
          <input nbInput fullWidth formControlName="twitter" type="url" placeholder="https://twitter.com/..." />
        </div>
      </div>

      <div class="cf-row">
        <div class="cf-field">
          <label class="cf-label cf-social-label">
            <fa-icon [icon]="icons.faGithub" class="cf-social-icon"></fa-icon> GitHub
          </label>
          <input nbInput fullWidth formControlName="github" type="url" placeholder="https://github.com/..." />
        </div>
        <div class="cf-field">
          <label class="cf-label cf-social-label">
            <fa-icon [icon]="icons.faLinkedin" class="cf-social-icon cf-linkedin"></fa-icon> LinkedIn
          </label>
          <input nbInput fullWidth formControlName="linkedin" type="url" placeholder="https://linkedin.com/..." />
        </div>
      </div>

      <div class="cf-row">
        <div class="cf-field">
          <label class="cf-label cf-social-label">
            <fa-icon [icon]="icons.faInstagram" class="cf-social-icon cf-instagram"></fa-icon> Instagram
          </label>
          <input nbInput fullWidth formControlName="instagram" type="url" placeholder="https://instagram.com/..." />
        </div>
      </div>
    </form>
  </com-card-body>

  <com-card-footer>
    <div class="cf-footer">
      <button nbButton ghost (click)="close()" [disabled]="isSubmitting" type="button">Cancel</button>
      <button
        nbButton
        status="primary"
        type="button"
        [disabled]="
          communityGroupForm.invalid || isSubmitting || slugCheckState === 'taken' || slugCheckState === 'checking'
        "
        (click)="createCommunityGroup()"
      >
        <nb-icon *ngIf="isSubmitting" icon="loader-outline" class="cf-spinning"></nb-icon>
        {{ isSubmitting ? 'Creating...' : 'Create Organization' }}
      </button>
    </div>
  </com-card-footer>
</com-card>
