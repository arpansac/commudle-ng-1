<div class="header">
  <div *ngIf="header" [ngStyle]="{ 'background-color': header.background_color.hex }" class="background">
    <div class="base-layout">
      <div class="content">
        <div class="header-text">
          <h1 class="title">
            {{ header.title }}
          </h1>
          <p class="heading">{{ header.heading }}</p>
          <div *ngIf="richText" [innerHTML]="richText" class="content"></div>
        </div>
        <ng-container *ngIf="header?.image_link">
          <a class="header-image" [href]="header.image_link">
            <img [src]="imageUrl(header.header_image).url()" class="com-w-full" />
          </a>
        </ng-container>
        <ng-container *ngIf="!header?.image_link">
          <div class="header-image">
            <img [src]="imageUrl(header.header_image).url()" class="com-w-full" />
          </div>
        </ng-container>
      </div>
    </div>
  </div>
</div>
