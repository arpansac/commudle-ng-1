<nb-card class="login-container">
  <nb-card-header>
    <h2>Sign In</h2>
  </nb-card-header>
  <nb-card-body class="com-self-center com-space-y-8">
    <div
      *ngIf="!libAuthWatchService.getAuthCookie()"
      class="com-flex com-justify-center"
      google-signin-button
      type="standard"
    ></div>

    <form [formGroup]="loginForm" class="login-form">
      <input formControlName="email" fullWidth nbInput placeholder="Ex. more@commudle.com" type="email" />
      <input
        *ngIf="isEmailSent"
        formControlName="code"
        fullWidth
        nbInput
        placeholder="Enter OTP here"
        type="password"
        status="info"
      />
      <button
        (click)="sendVerificationEmail()"
        *ngIf="!isEmailSent"
        [disabled]="loginForm.get('email').invalid"
        [nbSpinner]="isLoading"
        fullWidth
        nbButton
        status="primary"
      >
        Send Verification Code
      </button>
      <button
        (click)="loginUser()"
        *ngIf="isEmailSent"
        [disabled]="loginForm.invalid"
        [nbSpinner]="isLoading"
        fullWidth
        nbButton
        status="primary"
      >
        Login
      </button>
    </form>
  </nb-card-body>
</nb-card>
