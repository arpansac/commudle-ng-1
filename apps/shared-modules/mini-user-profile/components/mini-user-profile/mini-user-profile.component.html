<com-card class="mini-profile fade-in" (mouseout)="onMouseLeave()" (mouseover)="onMouseOver()">
  <com-card-body>
    <app-user-profile-card-large
      (componentClicked)="closePopup()"
      *ngIf="user"
      [activateMiniProfileDirective]="false"
      [user]="user"
    ></app-user-profile-card-large>

    <!-- Combined Activity & Stats - Top 5 by priority -->
    <div *ngIf="activityChips.length > 0" class="activity-chips">
      <span *ngFor="let chip of activityChips" class="chip" [ngClass]="'chip-' + chip.type">
        {{ chip.label }}
      </span>
    </div>

    <!-- User Tags -->
    <div *ngIf="miniUser.tags.length > 0" class="user-tags">
      <span *ngFor="let tag of miniUser.tags.slice(0, 5)" class="tag-chip">{{ tag.name }}</span>
    </div>

    <!-- Actions -->
    <div (click)="closePopup()" class="action-buttons">
      <app-user-follow [username]="miniUser.username" [name]="miniUser.name" [userId]="miniUser.id"></app-user-follow>
      <button (click)="openChatWithUser()" nbButton size="small" outline status="basic" shape="semi-round">
        <nb-icon icon="paper-plane"></nb-icon>
        Message
      </button>
    </div>
  </com-card-body>
</com-card>
