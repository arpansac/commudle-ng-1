<a [routerLink]="['/users', user.username]" [ngClass]="{ 'com-pointer-events-none': disableAnchor }">
  <div class="user-profile-small">
    <div class="avatar">
      <img
        [alt]="user.name"
        [src]="user.photo?.i32 || user.avatar"
        [title]="user.name"
        [username]="user.username"
        appMiniUserProfile
      />
    </div>
    <div [username]="user.username" appMiniUserProfile class="name">
      <span class="name-text">{{ user.name | truncatetext : maxNameLength }}</span>
      <commudle-user-expert-tick *ngIf="user.is_expert"></commudle-user-expert-tick>
      <commudle-user-personal-connect [userConnect]="user.distance_from_current_user"></commudle-user-personal-connect>
    </div>
  </div>
</a>
