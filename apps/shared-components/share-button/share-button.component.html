<button
  (click)="copyTextToClipboard()"
  [appearance]="appearance"
  [fullWidth]="fullWidth"
  [shape]="round ? 'round' : 'semi-round'"
  class="shr-btn"
  [ngClass]="{ 'custom-share-button': customShareButton }"
  nbButton
  size="small"
  [status]="status"
  [disabled]="disabled"
>
  <nb-icon icon="share"></nb-icon>
  <span *ngIf="showText">Share</span>
</button>
