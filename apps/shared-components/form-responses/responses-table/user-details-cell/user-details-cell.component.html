<div>
  <div class="user-details-container">
    <p class="timeago" title="{{ moment(userResponse.created_at).format('dddd Do MMM, YYYY h:mm A') }}">
      {{ moment(userResponse.created_at).fromNow() }}
    </p>
    <app-user-profile-card-large [user]="user"></app-user-profile-card-large>
    <p class="contact-details">
      <small>{{ user.email }}</small>
    </p>
    <div class="social-links">
      <a *ngIf="user.github" href="{{ user.github | completeurl : 'github' }}" target="_blank">
        <nb-icon icon="github"></nb-icon>
      </a>
      <a *ngIf="user.twitter" href="{{ user.twitter | completeurl : 'twitter' }}" target="_blank">
        <nb-icon icon="twitter"></nb-icon>
      </a>
      <a *ngIf="user.linkedin" href="{{ user.linkedin | completeurl : 'linkedin' }}" target="_blank">
        <nb-icon icon="linkedin"></nb-icon>
      </a>
      <a *ngIf="user.personal_website" href="{{ user.personal_website | completeurl }}" target="_blank">
        <nb-icon icon="info"></nb-icon>
      </a>
    </div>
  </div>
</div>
