<nb-card>
  <nb-card-body (click)="toggleShowAnswers()" class="faq-item">
    <div class="question">
      <p>{{ faq.question }}</p>
      <div class="actions">
        <fa-icon [icon]="showAnswer ? icons.faMinus : icons.faAdd"></fa-icon>
        <div class="admin-actions" *ngIf="isAdmin">
          <fa-icon
            [icon]="icons.faTrash"
            (click)="$event.stopPropagation(); openConfirmDialogBox(faq, deleteDialog)"
            class="com-text-red-500"
          ></fa-icon>
          <fa-icon
            [icon]="icons.faEdit"
            (click)="$event.stopPropagation(); editFaq(faq)"
            class="com-text-primary-500"
          ></fa-icon>
        </div>
      </div>
    </div>
    <p class="answer" *ngIf="showAnswer">{{ faq.answer }}</p>
  </nb-card-body>
</nb-card>

<ng-template #deleteDialog let-data let-ref="dialogRef">
  <nb-card class="template-card">
    <nb-card-header>
      <h3>Delete FAQ Confirmation</h3>
      <button ghost nbButton size="small" (click)="ref.close()">
        <nb-icon icon="close"></nb-icon>
      </button>
    </nb-card-header>
    <nb-card-body>
      <p>Are you sure you want to delete this FAQ?</p>
    </nb-card-body>
    <nb-card-footer>
      <button nbButton status="success" (click)="deleteFaq(data.faq); ref.close()">Confirm</button>&nbsp;
      <button nbButton status="danger" (click)="ref.close()">cancel</button>
    </nb-card-footer>
  </nb-card>
</ng-template>
