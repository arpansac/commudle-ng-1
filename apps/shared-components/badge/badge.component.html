<div [ngClass]="[color, borderRadius, position, dotMode === true ? 'dotmode' : '']">
  <div>
    <p
      [ngClass]="[
        fontColor,
        fontSize === 'small'
          ? 'small-text'
          : fontSize === 'x-small'
          ? 'x-small-text'
          : fontSize === 'xx-small'
          ? 'xx-small-text'
          : ''
      ]"
    >
      <nb-icon *ngIf="nbIcon" icon="{{ nbIcon }}"></nb-icon>
      {{ text }}
    </p>
  </div>
</div>
