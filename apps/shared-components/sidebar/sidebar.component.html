<div
  #sidebarElement
  class="sidebar custom-scrollbar"
  [ngClass]="{
    expanded: expandSidebar || isExpanded,
    forWindow: forWindow,
    notForWindow: !forWindow,
    hideFullSidebar: hideFullSidebar,
    left: position === ESidebarPosition.LEFT,
    right: position === ESidebarPosition.RIGHT,
    xsmall: expandedWidth === ESidebarWidth.XSMALL,
    small: expandedWidth === ESidebarWidth.SMALL,
    medium: expandedWidth === ESidebarWidth.MEDIUM,
    large: expandedWidth === ESidebarWidth.LARGE,
    extraLarge: expandedWidth === ESidebarWidth.XL,
    xxl: expandedWidth === ESidebarWidth.XXL,
    showBorder: showBorder,
  }"
>
  <div
    class="header"
    *ngIf="heading || showExpandedButton"
    [ngClass]="{
      'header-medium': textSize === ESidebarHeading.MEDIUM,
      'header-large': textSize === ESidebarHeading.XL,
    }"
  >
    <h1
      *ngIf="heading"
      class="title"
      (click)="handleSidebarToggle()"
      [ngClass]="{
        'com-pointer-events-none': !showExpandedButton,
      }"
    >
      {{ heading }}
    </h1>
    <div *ngIf="showExpandedButton" class="toggle" (click)="handleSidebarToggle()">
      <fa-icon [icon]="faRightLeft" class="com-cursor-pointer"></fa-icon>
    </div>
  </div>
  <ng-content></ng-content>
</div>
