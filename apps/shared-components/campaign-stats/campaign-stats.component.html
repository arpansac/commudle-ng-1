<div class="base-layout">
  <div class="container">
    <div class="one-column-layout">
      <nb-card>
        <nb-card-header> <h3>Campaign Stats</h3></nb-card-header>
        <nb-card-body *ngIf="campaignStats">
          <div class="graph-container">
            <div
              class="campaign-graph-container"
              *ngIf="
                campaignStats.gender &&
                (campaignStats.gender.male > 0 ||
                  campaignStats.gender.female > 0 ||
                  campaignStats.gender.prefer_not_to_answer > 0 ||
                  campaignStats.gender.unknown > 0)
              "
            >
              <span class="title">Gender Distribution</span>
              <div class="chart-container">
                <canvas #genderDistribution></canvas>
              </div>
            </div>

            <div class="campaign-graph-container" *ngIf="campaignStats.tags?.total > 0">
              <span class="title">User Tags</span>
              <div class="chart-container">
                <nb-tag-list *ngIf="campaignStats.tags?.tags">
                  <nb-tag
                    status="info"
                    appearance="outline"
                    *ngFor="let tag of campaignStats.tags.tags"
                    text="{{ tag.tag }} ({{ tag.users }})"
                    [removable]="false"
                  ></nb-tag>
                </nb-tag-list>
              </div>
            </div>
          </div>

          <div
            class="graph-container"
            *ngIf="
              (campaignStatsTimeseries && campaignStatsTimeseries.impressions) ||
              (campaignStats && campaignStats.locations)
            "
          >
            <div
              class="campaign-graph-container"
              *ngIf="campaignStatsTimeseries && campaignStatsTimeseries.impressions"
            >
              <span class="title">Views Over Days</span>
              <div class="chart-container">
                <canvas #viewsOverDays></canvas>
              </div>
            </div>
            <div class="map" *ngIf="campaignStats && campaignStats.locations">
              <div class="campaign-graph-container">
                <span class="title">Map Wise Distribution</span>
                <div class="chart-container">
                  <div id="regions_div"></div>
                </div>
              </div>
            </div>
          </div>

          <div
            class="graph-container"
            *ngIf="campaignStatsTimeseries && (campaignStatsTimeseries.ctr || campaignStatsTimeseries.clicks)"
          >
            <div *ngIf="campaignStatsTimeseries.ctr" class="campaign-graph-container">
              <span class="title">Click Through Rate (CTR)</span>
              <div class="chart-container">
                <canvas #clicksOverDays></canvas>
              </div>
            </div>

            <div *ngIf="campaignStatsTimeseries.clicks" class="campaign-graph-container">
              <span class="title">Clicks</span>
              <div class="chart-container">
                <canvas #clicksOverTime></canvas>
              </div>
            </div>
          </div>
        </nb-card-body>
      </nb-card>
    </div>
  </div>
</div>
