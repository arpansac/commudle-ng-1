<div class="discussion-chat-component">
  <div #messagesContainer class="messages">
    <div class="com-h-full">
      <div *ngIf="messages.length > 0 && !allMessagesLoaded" #loadPreviousSentinel class="load-previous-sentinel">
        <span *ngIf="loadingMessages" class="load-previous-label">Loading older messages…</span>
      </div>
      <div *ngFor="let group of groupedMessages">
        <h3 class="grouped-date">{{ moment(group.date).format('ddd, MMM D, YYYY') }}</h3>
        <div *ngFor="let message of group.messages; let i = index">
          <app-personal-chat-message
            [message]="message"
            [showTail]="!group.messages[i - 1] || group.messages[i - 1].user?.id !== message.user?.id"
            [canReply]="!blocked"
            [permittedActions]="permittedActions"
            [allActions]="allActions"
            [currentUser]="currentUser"
            [showFlagIcon]="false"
            [showReplyIcon]="false"
            (sendReply)="sendReply($event, message.id)"
            (sendVote)="sendVote($event)"
            (sendDelete)="delete($event)"
            (sendFlag)="sendFlag($event)"
          ></app-personal-chat-message>
        </div>
      </div>
      <div *ngIf="messages.length === 0" class="filler-message">
        <h4>Be the first one to message!</h4>
      </div>
    </div>
  </div>

  <div class="send-message-form">
    <commudle-editor
      *ngIf="currentUser && !blocked"
      [editable]="true"
      [placeholder]="'Type Here'"
      [status]="'info'"
      [appearance]="'filled'"
      (contentChange)="sendMessage($event)"
      [validators]="validators"
    ></commudle-editor>
    <p *ngIf="currentUser && blocked" class="blocked-text">You have blocked this User</p>

    <button *ngIf="!currentUser" nbButton fullWidth status="primary" class="login-button" (click)="login()">
      Post a Message
    </button>
  </div>
</div>
