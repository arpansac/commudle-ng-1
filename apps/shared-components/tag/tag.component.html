<div class="tag-list" [ngClass]="{ editable: editable }">
  <span
    class="tag"
    *ngFor="let tag of getTags()"
    [ngClass]="{ tiny: size === 'tiny' }"
    class="{{ backgroundColor }} {{ fontColor }}"
  >
    {{ tag }}
    <fa-icon *ngIf="editable" class="remove-icon" (click)="onTagRemove(tag)" [icon]="faXmark"></fa-icon>
  </span>

  <form [formGroup]="searchForm">
    <input
      (tagAdd)="onTagAdd($event)"
      (keydown)="onKeyDown($event)"
      *ngIf="editable"
      [disabled]="inputDisabled"
      nbInput
      fullWidth
      nbTagInput
      formControlName="q"
      [placeholder]="
        minTagLimit
          ? 'Type something and press enter to keep adding (At least ' + minimumTags + ' tags)'
          : 'Type something and press enter to keep adding'
      "
      type="text"
      list="tags"
    />

    <datalist id="tags">
      <option *ngFor="let tag of suggestedTags" [value]="tag.name"></option>
    </datalist>
  </form>
</div>
