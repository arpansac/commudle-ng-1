<div class="product-price-container" *ngIf="productPrice">
  <!-- Product and Plan Details -->
  <div class="product-price-details">
    <h3 class="">{{ productPrice.product_name }}</h3>
    <p class="">{{ productPrice.plan_name }}</p>
  </div>

  <!-- Pricing Details -->
  <div class="pricing-details">
    <span class="final-price">{{ productPrice.final_price | currency : productPrice.currency }}</span>
    <span class="community-text">per community</span>

    <div class="discount-container" *ngIf="hasDiscount">
      <span class="original-price">{{ productPrice.original_price | currency : productPrice.currency }}</span>
      <span class="discount-price"> {{ productPrice.discount }} OFF </span>
    </div>
  </div>

  <!-- Quantity Requirements -->
  <div class="min-quantity-container">
    <p class="min-quantity">Minimum quantity: {{ productPrice.min_quantity }}</p>
  </div>
</div>
