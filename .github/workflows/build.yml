name: Build & Package Angular SSR

# Builds the commudle-admin SSR app the same way `build.sh` does locally
# (npx nx run commudle-admin:release), which produces a deployable bundle at
# dist/prod-server-bundle (and, as a byproduct, prod-server.zip at the repo root).
#
# IMPORTANT: we upload the UNZIPPED bundle directory (dist/prod-server-bundle),
# not prod-server.zip, as the workflow artifact. actions/upload-artifact always
# wraps whatever you give it in a zip when you download it from the UI/API. If
# we uploaded prod-server.zip directly, the download would be a zip-of-a-zip:
# unzipping the download once still leaves you with a single "prod-server.zip"
# file instead of package.json/commudle-admin/etc at the root, which is exactly
# why Elastic Beanstalk failed with "Please provide a package.json file or add
# server.js/app.js file in source bundle".
#
# By uploading the raw bundle directory instead, GitHub zips it exactly once.
# The zip you download from the Actions run summary is then directly
# deployable to Elastic Beanstalk — no extra unzip/rezip step required.
on:
  push:
    branches: [release/test]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to bake into the build (libs/shared/environments)'
        required: false
        default: production
        type: choice
        options:
          - local
          - test
          - staging
          - production

# Cancel any older in-progress run on the same branch so only the latest
# push gets packaged.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Nx + Angular SSR builds are memory-hungry; the default GH runner
      # heap size can OOM mid-build without this.
      NODE_OPTIONS: --max-old-space-size=4096
      ENV_FILE: libs/shared/environments/src/lib/environments.ts
      TARGET_ENV: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set target environment
        run: |
          echo "Baking '${TARGET_ENV}' environment into the build"
          sed -i "s/export const environment = environments\['.*'\];/export const environment = environments['${TARGET_ENV}'];/" "$ENV_FILE"
          grep "export const environment" "$ENV_FILE"

      - name: Build & package SSR release
        run: npx nx run commudle-admin:release

      - name: Verify build bundle
        run: |
          BUNDLE_DIR="dist/prod-server-bundle"
          if [ ! -f "$BUNDLE_DIR/package.json" ]; then
            echo "::error::$BUNDLE_DIR/package.json was not produced by the release build"
            exit 1
          fi
          if [ ! -f "$BUNDLE_DIR/commudle-admin/server/main.js" ]; then
            echo "::error::$BUNDLE_DIR/commudle-admin/server/main.js is missing"
            exit 1
          fi
          echo "Bundle contents:"
          ls -la "$BUNDLE_DIR"

      # Upload the unzipped bundle directory, NOT prod-server.zip.
      # This avoids the zip-of-a-zip problem described above: GitHub will
      # produce exactly one zip on download, and that zip is ready to upload
      # to Elastic Beanstalk as-is.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-server-${{ github.sha }}
          path: dist/prod-server-bundle/
          retention-days: 14
          if-no-files-found: error
