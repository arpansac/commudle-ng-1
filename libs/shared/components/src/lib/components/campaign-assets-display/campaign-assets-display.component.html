<div class="carousel">
  <div
    *ngIf="campaign"
    class="container"
    [ngStyle]="{
          transform: 'translateX(-' + currentSlide * 100 + '%)',
        }"
  >
    <div class="component-container-wrapper welcome" *ngFor="let ca of campaign.campaign_assets">
      <a [href]="ca.url" target="_blank">
        <img [src]="ca.image.url" class="slider-image" [alt]="ca.headline" [title]="ca.headline" />
      </a>
    </div>
  </div>
</div>
