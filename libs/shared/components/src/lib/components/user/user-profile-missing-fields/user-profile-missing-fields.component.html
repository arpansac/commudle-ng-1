<div class="missing-fields-container" *ngIf="missingFieldsData.length > 0">
  <h3 class="missing-fields-title">Complete your profile</h3>
  <div class="missing-field-item" *ngFor="let field of missingFieldsData; let i = index">
    <div class="missing-field-text">
      <span class="number">{{ i + 1 }}. </span>
      <span class="text">{{ field.text }}</span>
      <span class="bold-text">{{ field.bold_text }}</span>
    </div>
    <a [routerLink]="field.route">
      <button nbButton status="primary" shape="semi-round">{{ field.button_text }}</button>
    </a>
  </div>
</div>
